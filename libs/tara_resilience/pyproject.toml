[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tara-resilience"
version = "0.1.0"
description = "Tara resilience primitives: idempotency, retry-with-backoff, circuit breaker."
requires-python = ">=3.12"
dependencies = ["Django>=5.0"]

[tool.setuptools.packages.find]
include = ["tara_resilience*"]
