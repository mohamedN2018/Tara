[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tara-events"
version = "0.1.0"
description = "Tara event backbone: versioned envelope, outbox pattern, swappable publisher."
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0",
    "kombu>=5.3",
    "celery>=5.3",
]

[tool.setuptools.packages.find]
include = ["tara_events*"]
