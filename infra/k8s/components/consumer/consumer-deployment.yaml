apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  labels:
    app.kubernetes.io/component: consumer
spec:
  # Competing consumers on a shared durable queue: each event is handled once,
  # and handlers are idempotent (ProcessedEvent dedup), so replicas scale safely.
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/component: consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/component: consumer
    spec:
      serviceAccountName: service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: consumer
          image: tara/service:latest
          command: ["python", "manage.py", "consume_events"]
          envFrom:
            - configMapRef:
                name: service-config
            - secretRef:
                name: service-secrets
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
