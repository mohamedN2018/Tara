# EXAMPLE — External Secrets Operator (ESO) ClusterSecretStore.
# Replace the provider block with your real backend (AWS Secrets Manager shown;
# Vault / GCP / Azure are analogous). Requires ESO installed in the cluster.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: tara-secret-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: __REPLACE_ME__
      auth:
        # Prefer IRSA (IAM Roles for Service Accounts) over static keys.
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
