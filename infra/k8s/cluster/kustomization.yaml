apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cluster-scoped, install-once resources (namespace + TLS issuers).
# Secret-store / external-secret templates live alongside as *.example.yaml and
# are NOT built here (they are environment-specific — copy and fill per cluster).
resources:
  - namespace.yaml
  - cluster-issuer.yaml
