apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tara
namePrefix: chat-

commonLabels:
  app.kubernetes.io/name: chat
  app.kubernetes.io/part-of: tara

resources:
  - ../../base
  - configmap.yaml
  - secret.example.yaml
  - migrate-job.yaml
  - ingress.yaml

components:
  - ../../components/worker
  - ../../components/consumer

images:
  - name: tara/service
    newName: ghcr.io/your-org/tara-chat
    newTag: "1.0.0"

patches:
  - path: patch-deployment.yaml
    target:
      kind: Deployment
