apiVersion: v1
kind: ConfigMap
metadata:
  name: service-config
data:
  CHAT_DEBUG: "false"
  CHAT_ALLOWED_HOSTS: "chat.tara.svc.cluster.local,api.tara.example"
  CHAT_CORS_ORIGINS: "https://app.tara.example"
  POSTGRES_HOST: "chat-db.tara.svc.cluster.local"
  POSTGRES_PORT: "5432"
  CHAT_DB_NAME: "chat_db"
  CHAT_DB_USER: "chat"
  REDIS_URL: "redis://redis.tara.svc.cluster.local:6379/0"
  RABBITMQ_URL: "amqp://rabbitmq.tara.svc.cluster.local:5672//"
  TARA_JWKS_URL: "https://api.tara.example/.well-known/jwks.json"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
