# EXAMPLE — production replacement for this overlay's secret.example.yaml.
# Apply separately (NOT in the kustomization): ESO creates the Secret at the
# literal target.name `identity-service-secrets` — the already-prefixed name the Deployment's
# envFrom expects (kustomize namePrefix is not applied to runtime secrets).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: identity-service-secrets
  namespace: tara
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: tara-secret-store
  target:
    name: identity-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: IDENTITY_SECRET_KEY
      remoteRef:
        key: tara/identity/identity_secret_key
    - secretKey: IDENTITY_DB_PASSWORD
      remoteRef:
        key: tara/identity/identity_db_password
    - secretKey: INTERNAL_JWT_SECRET
      remoteRef:
        key: tara/shared/internal_jwt_secret
    - secretKey: IDENTITY_JWT_PRIVATE_KEY
      remoteRef:
        key: tara/identity/identity_jwt_private_key
    - secretKey: IDENTITY_JWT_PUBLIC_KEY
      remoteRef:
        key: tara/identity/identity_jwt_public_key
