# Edge ingress for the identity routes. The NGINX annotations mirror the Traefik
# gateway middlewares used in compose (security headers + rate limit + TLS
# redirect), so the security posture is the same in both environments.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.tara.example
      secretName: tara-api-tls
  rules:
    - host: api.tara.example
      http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: service
                port:
                  number: 80
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: service
                port:
                  number: 80
