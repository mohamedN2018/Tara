# Pre-rollout migration Job. Run this to completion BEFORE the new Deployment
# revision rolls out (e.g. as an Argo PreSync hook or a CI step). This replaces
# the dev-only "migrate at container boot" behaviour with real migration
# discipline (see docs/architecture/phase-9).
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: migrate
          image: tara/service:latest
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: service-config
            - secretRef:
                name: service-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
