apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Worked example: the identity service. The other 13 services follow this exact
# overlay shape — copy this directory, change the namePrefix/labels/image and the
# config/secret/ingress values.
namespace: tara
namePrefix: identity-

commonLabels:
  app.kubernetes.io/name: identity
  app.kubernetes.io/part-of: tara

resources:
  - ../../base
  - configmap.yaml
  - secret.example.yaml
  - migrate-job.yaml
  - ingress.yaml

# Identity emits events (account.registered, ...) but consumes none → worker only.
components:
  - ../../components/worker

images:
  - name: tara/service
    newName: ghcr.io/your-org/tara-identity
    newTag: "1.0.0"

patches:
  - path: patch-deployment.yaml
    target:
      kind: Deployment
