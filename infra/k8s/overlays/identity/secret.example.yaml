# EXAMPLE ONLY — do not apply as-is. Real secrets must come from a secret
# manager (External Secrets Operator, Sealed Secrets, or SOPS), never committed.
# Every value here is a placeholder; the production-safety deploy check
# (tara.E001..E003) will REJECT these "REPLACE_ME" values if they ever reach a
# DEBUG=false process, which is the intended safety net.
apiVersion: v1
kind: Secret
metadata:
  name: service-secrets
type: Opaque
stringData:
  IDENTITY_SECRET_KEY: "REPLACE_ME_FROM_SECRET_MANAGER"
  IDENTITY_DB_PASSWORD: "REPLACE_ME_FROM_SECRET_MANAGER"
  INTERNAL_JWT_SECRET: "REPLACE_ME_FROM_SECRET_MANAGER"
  # RS256 PEM keypair for issuing/verifying access tokens (JWKS).
  IDENTITY_JWT_PRIVATE_KEY: "REPLACE_ME_PEM_PRIVATE_KEY"
  IDENTITY_JWT_PUBLIC_KEY: "REPLACE_ME_PEM_PUBLIC_KEY"
