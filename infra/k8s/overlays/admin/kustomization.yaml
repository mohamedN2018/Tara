apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tara
namePrefix: admin-

commonLabels:
  app.kubernetes.io/name: admin
  app.kubernetes.io/part-of: tara

resources:
  - ../../base
  - configmap.yaml
  - secret.example.yaml
  - migrate-job.yaml
  - ingress.yaml

images:
  - name: tara/service
    newName: ghcr.io/your-org/tara-admin
    newTag: "1.0.0"

patches:
  - path: patch-deployment.yaml
    target:
      kind: Deployment
