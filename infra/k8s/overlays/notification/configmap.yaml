apiVersion: v1
kind: ConfigMap
metadata:
  name: service-config
data:
  NOTIFICATION_DEBUG: "false"
  NOTIFICATION_ALLOWED_HOSTS: "notification.tara.svc.cluster.local,api.tara.example"
  NOTIFICATION_CORS_ORIGINS: "https://app.tara.example"
  POSTGRES_HOST: "notification-db.tara.svc.cluster.local"
  POSTGRES_PORT: "5432"
  NOTIF_DB_NAME: "notif_db"
  NOTIF_DB_USER: "notif"
  REDIS_URL: "redis://redis.tara.svc.cluster.local:6379/0"
  RABBITMQ_URL: "amqp://rabbitmq.tara.svc.cluster.local:5672//"
  TARA_JWKS_URL: "https://api.tara.example/.well-known/jwks.json"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
