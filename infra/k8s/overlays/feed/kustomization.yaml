apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tara
namePrefix: feed-

commonLabels:
  app.kubernetes.io/name: feed
  app.kubernetes.io/part-of: tara

resources:
  - ../../base
  - configmap.yaml
  - secret.example.yaml
  - migrate-job.yaml
  - ingress.yaml
  - signals-deployment.yaml

components:
  - ../../components/worker
  - ../../components/consumer

images:
  - name: tara/service
    newName: ghcr.io/your-org/tara-feed
    newTag: "1.0.0"

patches:
  # Only the API deployment: an unnamed target also appended a bogus "app" container
  # (no image) to feed-signals, the consumer and the worker.
  - path: patch-deployment.yaml
    target:
      kind: Deployment
      name: service
