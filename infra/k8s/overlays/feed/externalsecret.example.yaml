# EXAMPLE — production replacement for this overlay's secret.example.yaml.
# Apply separately (NOT in the kustomization): ESO creates the Secret at the
# literal target.name `feed-service-secrets` — the already-prefixed name the Deployment's
# envFrom expects (kustomize namePrefix is not applied to runtime secrets).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: feed-service-secrets
  namespace: tara
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: tara-secret-store
  target:
    name: feed-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: FEED_SECRET_KEY
      remoteRef:
        key: tara/feed/feed_secret_key
    - secretKey: FEED_DB_PASSWORD
      remoteRef:
        key: tara/feed/feed_db_password
    - secretKey: INTERNAL_JWT_SECRET
      remoteRef:
        key: tara/shared/internal_jwt_secret
    - secretKey: INTEL_SERVE_TOKEN_SECRET
      remoteRef:
        key: tara/feed/intel_serve_token_secret
