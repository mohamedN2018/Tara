# Telemetry ingestion (Tara Intelligence WP 2.4): the feed image as its own process
# role, so signal batches never queue behind feed pages. It never migrates (the
# migrate Job does); the ingress sends /api/v1/feed/signals here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signals
  labels:
    app.kubernetes.io/component: signals
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/component: signals
  template:
    metadata:
      labels:
        app.kubernetes.io/component: signals
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: signals
          image: tara/service:latest
          command: ["gunicorn"]
          args:
            - "config.wsgi:application"
            - "--bind=0.0.0.0:8000"
            - "--workers=2"
            - "--timeout=30"
            - "--access-logfile=-"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: service-config
            - secretRef:
                name: service-secrets
          env:
            - name: RUN_MIGRATIONS
              value: "false"
          readinessProbe:
            httpGet:
              path: /readyz/
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz/
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: signals
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: signals
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
