apiVersion: v1
kind: ConfigMap
metadata:
  name: service-config
data:
  FEED_DEBUG: "false"
  FEED_ALLOWED_HOSTS: "feed.tara.svc.cluster.local,api.tara.example"
  FEED_CORS_ORIGINS: "https://app.tara.example"
  POSTGRES_HOST: "feed-db.tara.svc.cluster.local"
  POSTGRES_PORT: "5432"
  FEED_DB_NAME: "feed_db"
  FEED_DB_USER: "feed"
  REDIS_URL: "redis://redis.tara.svc.cluster.local:6379/0"
  RABBITMQ_URL: "amqp://rabbitmq.tara.svc.cluster.local:5672//"
  TARA_JWKS_URL: "https://api.tara.example/.well-known/jwks.json"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  ADS_INTERNAL_URL: "http://ads.tara.svc.cluster.local:8000"
  # Tara Intelligence (INTEL_SERVE_TOKEN_SECRET comes from the secret).
  INTEL_ACCEPT_SYNTHETIC: "false"
  INTEL_SYNTHETIC_IN_RANKING: "false"
  INTEL_SIGNAL_RETENTION_DAYS: "30"
  INTEL_ENGAGEMENT_RETENTION_DAYS: "30"
  # WP 4.1: ranking config changes are audited in admin (intel.config.changed).
  INTEL_EMIT_CONFIG_CHANGED: "true"
