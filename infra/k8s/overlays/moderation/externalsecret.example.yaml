# EXAMPLE — production replacement for this overlay's secret.example.yaml.
# Apply separately (NOT in the kustomization): ESO creates the Secret at the
# literal target.name `moderation-service-secrets` — the already-prefixed name the Deployment's
# envFrom expects (kustomize namePrefix is not applied to runtime secrets).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: moderation-service-secrets
  namespace: tara
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: tara-secret-store
  target:
    name: moderation-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: MODERATION_SECRET_KEY
      remoteRef:
        key: tara/moderation/moderation_secret_key
    - secretKey: MODERATION_DB_PASSWORD
      remoteRef:
        key: tara/moderation/moderation_db_password
    - secretKey: INTERNAL_JWT_SECRET
      remoteRef:
        key: tara/shared/internal_jwt_secret
