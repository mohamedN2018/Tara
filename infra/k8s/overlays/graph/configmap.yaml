apiVersion: v1
kind: ConfigMap
metadata:
  name: service-config
data:
  GRAPH_DEBUG: "false"
  GRAPH_ALLOWED_HOSTS: "graph.tara.svc.cluster.local,api.tara.example"
  GRAPH_CORS_ORIGINS: "https://app.tara.example"
  POSTGRES_HOST: "graph-db.tara.svc.cluster.local"
  POSTGRES_PORT: "5432"
  GRAPH_DB_NAME: "graph_db"
  GRAPH_DB_USER: "graph"
  REDIS_URL: "redis://redis.tara.svc.cluster.local:6379/0"
  RABBITMQ_URL: "amqp://rabbitmq.tara.svc.cluster.local:5672//"
  TARA_JWKS_URL: "https://api.tara.example/.well-known/jwks.json"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  # Tara Intelligence R4 (track B)
  INTEL_EMIT_EXPOSURE_EVENTS: "true"
