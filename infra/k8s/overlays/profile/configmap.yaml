apiVersion: v1
kind: ConfigMap
metadata:
  name: service-config
data:
  PROFILE_DEBUG: "false"
  PROFILE_ALLOWED_HOSTS: "profile.tara.svc.cluster.local,api.tara.example"
  PROFILE_CORS_ORIGINS: "https://app.tara.example"
  POSTGRES_HOST: "profile-db.tara.svc.cluster.local"
  POSTGRES_PORT: "5432"
  PROFILE_DB_NAME: "profile_db"
  PROFILE_DB_USER: "profile"
  REDIS_URL: "redis://redis.tara.svc.cluster.local:6379/0"
  RABBITMQ_URL: "amqp://rabbitmq.tara.svc.cluster.local:5672//"
  TARA_JWKS_URL: "https://api.tara.example/.well-known/jwks.json"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  GRAPH_INTERNAL_URL: "http://graph.tara.svc.cluster.local:8000"
