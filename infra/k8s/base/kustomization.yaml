apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Generic, service-agnostic base. Overlays set the name prefix, image, labels,
# config, and secrets per service. See overlays/identity for the worked example.
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
