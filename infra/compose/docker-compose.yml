# Tara — local development stack.
# Usage (from repo root): make up  (core profile)  /  make up-full
# Each service is its own container (true microservices); Compose profiles let
# you run only what you need.  See docs/architecture/phase-0/06-infrastructure-plan.md
name: tara

x-identity-env: &identity-env
  env_file:
    - ../../.env
  environment:
    POSTGRES_HOST: postgres
    REDIS_URL: redis://redis:6379/0
    RABBITMQ_URL: ${RABBITMQ_URL}
    EMAIL_HOST: mailpit
    EMAIL_PORT: "1025"
    IDENTITY_JWT_KEY_DIR: /app/.keys

# Tara Intelligence in dev: the whole dev dataset is synthetic, so seed accounts are
# accepted and still feed the ranking; raw telemetry is kept 90 days so the 60-day
# synthetic history survives. Production (docker-compose.dokploy.yml) refuses both.
x-feed-intel-env: &feed-intel-env
  INTEL_SERVE_TOKEN_SECRET: ${INTEL_SERVE_TOKEN_SECRET:-dev-only-intel-serve-token-secret-change-me}
  INTEL_ACCEPT_SYNTHETIC: ${INTEL_ACCEPT_SYNTHETIC:-true}
  INTEL_SYNTHETIC_IN_RANKING: ${INTEL_SYNTHETIC_IN_RANKING:-true}
  INTEL_SIGNAL_RETENTION_DAYS: ${INTEL_SIGNAL_RETENTION_DAYS:-90}
  INTEL_ENGAGEMENT_RETENTION_DAYS: ${INTEL_ENGAGEMENT_RETENTION_DAYS:-30}
  INTEL_EMIT_CONFIG_CHANGED: ${INTEL_EMIT_CONFIG_CHANGED:-true}
  # X-Tara-Test-Now for seed/test accounts (WP 4b.15); development only, default off.
  INTEL_TEST_CLOCK_ENABLED: ${INTEL_TEST_CLOCK_ENABLED:-false}

services:
  # ---- Backing services ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      IDENTITY_DB_NAME: ${IDENTITY_DB_NAME}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      PROFILE_DB_NAME: ${PROFILE_DB_NAME}
      PROFILE_DB_USER: ${PROFILE_DB_USER}
      PROFILE_DB_PASSWORD: ${PROFILE_DB_PASSWORD}
      GRAPH_DB_NAME: ${GRAPH_DB_NAME}
      GRAPH_DB_USER: ${GRAPH_DB_USER}
      GRAPH_DB_PASSWORD: ${GRAPH_DB_PASSWORD}
      MEDIA_DB_NAME: ${MEDIA_DB_NAME}
      MEDIA_DB_USER: ${MEDIA_DB_USER}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD}
      POST_DB_NAME: ${POST_DB_NAME}
      POST_DB_USER: ${POST_DB_USER}
      POST_DB_PASSWORD: ${POST_DB_PASSWORD}
      FEED_DB_NAME: ${FEED_DB_NAME}
      FEED_DB_USER: ${FEED_DB_USER}
      FEED_DB_PASSWORD: ${FEED_DB_PASSWORD}
      CHAT_DB_NAME: ${CHAT_DB_NAME}
      CHAT_DB_USER: ${CHAT_DB_USER}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD}
      MARKET_DB_NAME: ${MARKET_DB_NAME}
      MARKET_DB_USER: ${MARKET_DB_USER}
      MARKET_DB_PASSWORD: ${MARKET_DB_PASSWORD}
      NOTIF_DB_NAME: ${NOTIF_DB_NAME}
      NOTIF_DB_USER: ${NOTIF_DB_USER}
      NOTIF_DB_PASSWORD: ${NOTIF_DB_PASSWORD}
      SEARCH_DB_NAME: ${SEARCH_DB_NAME}
      SEARCH_DB_USER: ${SEARCH_DB_USER}
      SEARCH_DB_PASSWORD: ${SEARCH_DB_PASSWORD}
      MODERATION_DB_NAME: ${MODERATION_DB_NAME}
      MODERATION_DB_USER: ${MODERATION_DB_USER}
      MODERATION_DB_PASSWORD: ${MODERATION_DB_PASSWORD}
      ADMIN_DB_NAME: ${ADMIN_DB_NAME}
      ADMIN_DB_USER: ${ADMIN_DB_USER}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD}
      ADS_DB_NAME: ${ADS_DB_NAME}
      ADS_DB_USER: ${ADS_DB_USER}
      ADS_DB_PASSWORD: ${ADS_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5435:5432"   # host 5435 (5432 is used by another local project)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["core"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6381:6379"   # host 6381 (6379 is used by another local project)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Heavy, rebuildable state (feed ranking sessions 1.7, pools and first-page heads
  # of Tara Intelligence) kept out of the shared Redis. noeviction: a full redis-hot
  # refuses writes and feed falls back to latest order; nothing is persisted.
  # 384 MB: budget about 190 MB worst case at 10k DAU, >= 2x headroom (07 WP 4b.0).
  redis-hot:
    image: redis:7-alpine
    profiles: ["core"]
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    # Same limit as Dokploy (07 WP 4b.0): maxmemory plus Redis overhead.
    mem_limit: 448m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    profiles: ["core"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # Official minio/minio images are no longer published; pinned by digest.
    image: cgr.dev/chainguard/minio@sha256:090010a3f73f6aa2dff606c61cd0de3640b22748abe19f4e48cce6dc9de7a53f
    profiles: ["core"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      # The image has no shell or curl; media itself retries S3 and creates the bucket.
      test: ["CMD", "minio", "--version"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["core"]
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1026}:1025"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8026}:8025"

  # ---- Edge ----------------------------------------------------------------
  traefik:
    image: traefik:v3.6
    profiles: ["core"]
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      # Apply security headers + rate limiting to ALL routed traffic at the edge.
      - --entrypoints.web.http.middlewares=tara-secure-headers@file,tara-ratelimit@file
    ports:
      - "127.0.0.1:8080:80"     # edge
      - "127.0.0.1:8081:8080"   # dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
    depends_on:
      - identity
      - bff

  # ---- Application services -------------------------------------------------
  identity:
    build:
      context: ../..
      dockerfile: services/identity/Dockerfile
    image: tara/identity:dev
    profiles: ["core"]
    <<: *identity-env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: ${RABBITMQ_URL}
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      IDENTITY_JWT_KEY_DIR: /app/.keys
      RUN_MIGRATIONS: "true"
    volumes:
      - identity-keys:/app/.keys
    expose:
      - "8000"
    ports:
      - "127.0.0.1:${IDENTITY_HOST_PORT:-8100}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true
      - "traefik.http.routers.identity.rule=PathPrefix(`/api/v1/auth`) || Path(`/api/v1/me`) || PathPrefix(`/api/v1/me/`) || PathPrefix(`/.well-known`) || PathPrefix(`/admin`) || PathPrefix(`/healthz`) || PathPrefix(`/readyz`) || PathPrefix(`/metrics`) || PathPrefix(`/static`) || PathPrefix(`/api/v1/docs`) || PathPrefix(`/api/v1/schema`)"
      - traefik.http.routers.identity.entrypoints=web
      - traefik.http.services.identity.loadbalancer.server.port=8000

  identity-worker:
    image: tara/identity:dev
    profiles: ["core"]
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "2"]
    <<: *identity-env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: ${RABBITMQ_URL}
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      RUN_MIGRATIONS: "false"
      IDENTITY_JWT_KEY_DIR: /app/.keys
    volumes:
      - identity-keys:/app/.keys
    depends_on:
      identity:
        condition: service_healthy

  identity-beat:
    image: tara/identity:dev
    profiles: ["core"]
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    <<: *identity-env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: ${RABBITMQ_URL}
      RUN_MIGRATIONS: "false"
      IDENTITY_JWT_KEY_DIR: /app/.keys
    volumes:
      - identity-keys:/app/.keys
    depends_on:
      identity:
        condition: service_healthy

  bff:
    build:
      context: ../../services/bff
      dockerfile: Dockerfile
    image: tara/bff:dev
    profiles: ["core"]
    env_file:
      - ../../.env
    environment:
      BFF_IDENTITY_BASE_URL: http://identity:8000
      BFF_JWKS_URL: http://identity:8000/.well-known/jwks.json
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true
      - "traefik.http.routers.bff.rule=PathPrefix(`/bff`)"
      - traefik.http.routers.bff.entrypoints=web
      - traefik.http.services.bff.loadbalancer.server.port=8090

  # ---- Profile service (Phase 2) -------------------------------------------
  profile:
    build:
      context: ../..
      dockerfile: services/profile/Dockerfile
    image: tara/profile:dev
    profiles: ["core"]
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: ${RABBITMQ_URL}
      TARA_JWKS_URL: http://identity:8000/.well-known/jwks.json
      GRAPH_INTERNAL_URL: http://graph:8000
      RUN_MIGRATIONS: "true"
    # No host port published: the gateway reaches profile internally as profile:8000.
    # (Host 8001 is used by another local project.)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true
      - "traefik.http.routers.profile.rule=PathPrefix(`/api/v1/users`) || PathPrefix(`/api/v1/profile`) || PathPrefix(`/api/v1/pages`) || PathPrefix(`/api/v1/groups`)"
      - traefik.http.routers.profile.entrypoints=web
      - traefik.http.services.profile.loadbalancer.server.port=8000

  profile-relay:
    image: tara/profile:dev
    profiles: ["core"]
    command: ["celery", "-A", "config", "worker", "-B", "-l", "info", "--concurrency", "2"]
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: ${RABBITMQ_URL}
      RUN_MIGRATIONS: "false"
    depends_on:
      profile:
        condition: service_healthy

  profile-consumer:
    image: tara/profile:dev
    profiles: ["core"]
    command: ["python", "manage.py", "consume_events"]
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: ${RABBITMQ_URL}
      RUN_MIGRATIONS: "false"
    depends_on:
      profile:
        condition: service_healthy

  # ---- Social Graph service (Phase 2) --------------------------------------
  graph:
    build:
      context: ../..
      dockerfile: services/graph/Dockerfile
    image: tara/graph:dev
    profiles: ["core"]
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/2
      RABBITMQ_URL: ${RABBITMQ_URL}
      TARA_JWKS_URL: http://identity:8000/.well-known/jwks.json
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true
      - "traefik.http.routers.graph.rule=PathPrefix(`/api/v1/friends`) || PathPrefix(`/api/v1/follows`) || PathPrefix(`/api/v1/blocks`) || PathPrefix(`/api/v1/social`)"
      - traefik.http.routers.graph.entrypoints=web
      - traefik.http.services.graph.loadbalancer.server.port=8000

  graph-relay:
    image: tara/graph:dev
    profiles: ["core"]
    command: ["celery", "-A", "config", "worker", "-B", "-l", "info", "--concurrency", "2"]
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/2
      RABBITMQ_URL: ${RABBITMQ_URL}
      RUN_MIGRATIONS: "false"
    depends_on:
      graph:
        condition: service_healthy

  graph-consumer:
    image: tara/graph:dev
    profiles: ["core"]
    command: ["python", "manage.py", "consume_events"]
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/2
      RABBITMQ_URL: ${RABBITMQ_URL}
      RUN_MIGRATIONS: "false"
    depends_on:
      graph:
        condition: service_healthy

  # ---- Media service (Phase 3) ---------------------------------------------
  media:
    build:
      context: ../..
      dockerfile: services/media/Dockerfile
    image: tara/media:dev
    profiles: ["core"]
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/3
      RABBITMQ_URL: ${RABBITMQ_URL}
      TARA_JWKS_URL: http://identity:8000/.well-known/jwks.json
      S3_ENDPOINT_URL: http://minio:9000
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:8003:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true
      - "traefik.http.routers.media.rule=PathPrefix(`/api/v1/media`)"
      - traefik.http.routers.media.entrypoints=web
      - traefik.http.services.media.loadbalancer.server.port=8000

  media-relay:
    image: tara/media:dev
    profiles: ["core"]
    # Only media's own queue: video transcoding belongs to media-transcoder.
    command: ["celery", "-A", "config", "worker", "-B", "-Q", "media.tasks", "-l", "info", "--concurrency", "2"]
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/3
      RABBITMQ_URL: ${RABBITMQ_URL}
      S3_ENDPOINT_URL: http://minio:9000
      RUN_MIGRATIONS: "false"
    depends_on:
      media: {condition: service_healthy}

  # One-shot: the transcoder's MinIO user, scoped to videos/ (roadmap §5.1).
  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:39768db4c3fa811bc8f2e2a3e0add8ea391648b1c980de179985e1c353dc1805
    profiles: ["core"]
    entrypoint: ["/bin/sh", "/init/init-transcoder-user.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-tara-media}
      MEDIA_TRANSCODER_S3_ACCESS_KEY: ${MEDIA_TRANSCODER_S3_ACCESS_KEY:-tara-transcoder}
      MEDIA_TRANSCODER_S3_SECRET_KEY: ${MEDIA_TRANSCODER_S3_SECRET_KEY:-tara-transcoder-dev-pass}
    volumes:
      - ../minio:/init:ro
    restart: "no"
    depends_on:
      minio: {condition: service_healthy}

  # Video transcoder (roadmap 5.2): ffmpeg on its own queue, one job at a time.
  # Minimal environment on purpose (no env_file): its database, the broker, a
  # storage user that only reaches videos/, and the video limits. No JWT keys,
  # no INTERNAL_JWT_SECRET, no MinIO root.
  media-transcoder:
    image: tara/media:dev
    profiles: ["core"]
    command: ["celery", "-A", "config", "worker", "-Q", "media.transcode", "--concurrency", "1",
              "--prefetch-multiplier", "1", "-O", "fair", "--max-tasks-per-child", "50", "-l", "info"]
    environment:
      MEDIA_ROLE: transcoder
      POSTGRES_HOST: postgres
      MEDIA_DB_NAME: ${MEDIA_DB_NAME}
      MEDIA_DB_USER: ${MEDIA_DB_USER}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD}
      RABBITMQ_URL: ${RABBITMQ_URL}
      TARA_STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-tara-media}
      AWS_ACCESS_KEY_ID: ${MEDIA_TRANSCODER_S3_ACCESS_KEY:-tara-transcoder}
      AWS_SECRET_ACCESS_KEY: ${MEDIA_TRANSCODER_S3_SECRET_KEY:-tara-transcoder-dev-pass}
      MEDIA_VIDEO_MAX_SECONDS_POST: ${MEDIA_VIDEO_MAX_SECONDS_POST:-600}
      MEDIA_VIDEO_MAX_HEIGHT: ${MEDIA_VIDEO_MAX_HEIGHT:-720}
      MEDIA_VIDEO_HDR_MODE: ${MEDIA_VIDEO_HDR_MODE:-tonemap}
      MEDIA_VIDEO_MP4_FALLBACK: ${MEDIA_VIDEO_MP4_FALLBACK:-false}
      MEDIA_KEEP_VIDEO_ORIGINALS: ${MEDIA_KEEP_VIDEO_ORIGINALS:-false}
      MEDIA_TRANSCODE_STEP_TIMEOUT: ${MEDIA_TRANSCODE_STEP_TIMEOUT:-1200}
      MEDIA_TRANSCODE_CONSUMER_TIMEOUT_MS: ${MEDIA_TRANSCODE_CONSUMER_TIMEOUT_MS:-7200000}
      MEDIA_VIDEO_MAX_FPS: ${MEDIA_VIDEO_MAX_FPS:-30}
      MEDIA_VIDEO_MAX_PIXELS: ${MEDIA_VIDEO_MAX_PIXELS:-8294400}
      MEDIA_FFMPEG_THREADS: ${MEDIA_FFMPEG_THREADS:-2}
      MEDIA_FFMPEG_MAX_MEMORY_MB: ${MEDIA_FFMPEG_MAX_MEMORY_MB:-1200}
      LOG_FORMAT: console
    mem_limit: 1.5g
    cpus: 2
    depends_on:
      media: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  # ---- Post service (Phase 3) ----------------------------------------------
  post:
    build:
      context: ../..
      dockerfile: services/post/Dockerfile
    image: tara/post:dev
    profiles: ["core"]
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/4
      RABBITMQ_URL: ${RABBITMQ_URL}
      TARA_JWKS_URL: http://identity:8000/.well-known/jwks.json
      GRAPH_INTERNAL_URL: http://graph:8000
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:8004:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true
      - "traefik.http.routers.post.rule=PathPrefix(`/api/v1/posts`) || PathPrefix(`/api/v1/comments`) || PathPrefix(`/api/v1/saved`) || PathPrefix(`/api/v1/events`) || PathPrefix(`/api/v1/stories`) || PathPrefix(`/api/v1/reels`)"
      - traefik.http.routers.post.entrypoints=web
      - traefik.http.services.post.loadbalancer.server.port=8000

  post-relay:
    image: tara/post:dev
    profiles: ["core"]
    command: ["celery", "-A", "config", "worker", "-B", "-l", "info", "--concurrency", "2"]
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/4
      RABBITMQ_URL: ${RABBITMQ_URL}
      RUN_MIGRATIONS: "false"
    depends_on:
      post: {condition: service_healthy}

  post-consumer:
    image: tara/post:dev
    profiles: ["core"]
    command: ["python", "manage.py", "consume_events"]
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/4
      RABBITMQ_URL: ${RABBITMQ_URL}
      RUN_MIGRATIONS: "false"
    depends_on:
      post: {condition: service_healthy}

  # ---- Feed service (Phase 3) ----------------------------------------------
  feed:
    build:
      context: ../..
      dockerfile: services/feed/Dockerfile
    image: tara/feed:dev
    profiles: ["core"]
    env_file:
      - ../../.env
    environment:
      <<: *feed-intel-env
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/5
      REDIS_HOT_URL: ${REDIS_HOT_URL:-redis://redis-hot:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL}
      TARA_JWKS_URL: http://identity:8000/.well-known/jwks.json
      GRAPH_INTERNAL_URL: http://graph:8000
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:8005:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      redis-hot: {condition: service_started}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true
      - "traefik.http.routers.feed.rule=PathPrefix(`/api/v1/feed`)"
      - traefik.http.routers.feed.entrypoints=web
      - traefik.http.services.feed.loadbalancer.server.port=8000

  feed-relay:
    image: tara/feed:dev
    profiles: ["core"]
    command: ["celery", "-A", "config", "worker", "-B", "-l", "info", "--concurrency", "2"]
    env_file:
      - ../../.env
    environment:
      <<: *feed-intel-env
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/5
      # Beat's intel.rebuild_pools writes the discovery pools here (WP 4b.6).
      REDIS_HOT_URL: ${REDIS_HOT_URL:-redis://redis-hot:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL}
      RUN_MIGRATIONS: "false"
    depends_on:
      feed: {condition: service_healthy}

  feed-consumer:
    image: tara/feed:dev
    profiles: ["core"]
    command: ["python", "manage.py", "consume_events"]
    env_file:
      - ../../.env
    environment:
      <<: *feed-intel-env
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/5
      # account.deleted drops the account's ranking sessions and pool members (intel).
      REDIS_HOT_URL: ${REDIS_HOT_URL:-redis://redis-hot:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL}
      GRAPH_INTERNAL_URL: http://graph:8000
      RUN_MIGRATIONS: "false"
    depends_on:
      feed: {condition: service_healthy}

  # Telemetry ingestion (Tara Intelligence WP 2.4): same image, its own gunicorn,
  # never migrates. Traefik sends /api/v1/feed/signals here ahead of feed's router.
  feed-signals:
    image: tara/feed:dev
    profiles: ["core"]
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2", "--timeout", "30", "--access-logfile", "-"]
    env_file:
      - ../../.env
    environment:
      <<: *feed-intel-env
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/5
      REDIS_HOT_URL: ${REDIS_HOT_URL:-redis://redis-hot:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL}
      TARA_JWKS_URL: http://identity:8000/.well-known/jwks.json
      RUN_MIGRATIONS: "false"
    depends_on:
      feed: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true
      - "traefik.http.routers.feed-signals.rule=PathPrefix(`/api/v1/feed/signals`)"
      - traefik.http.routers.feed-signals.priority=200
      - traefik.http.routers.feed-signals.entrypoints=web
      - traefik.http.services.feed-signals.loadbalancer.server.port=8000

  # ---- Chat service (Phase 4) ----------------------------------------------
  chat:
    build:
      context: ../..
      dockerfile: services/chat/Dockerfile
    image: tara/chat:dev
    profiles: ["core"]
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/6
      RABBITMQ_URL: ${RABBITMQ_URL}
      TARA_JWKS_URL: http://identity:8000/.well-known/jwks.json
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:8006:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true
      - "traefik.http.routers.chat.rule=PathPrefix(`/api/v1/conversations`) || PathPrefix(`/api/v1/messages`) || PathPrefix(`/api/v1/calls`)"
      - traefik.http.routers.chat.entrypoints=web
      - traefik.http.services.chat.loadbalancer.server.port=8000

  chat-relay:
    image: tara/chat:dev
    profiles: ["core"]
    command: ["celery", "-A", "config", "worker", "-B", "-l", "info", "--concurrency", "2"]
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/6
      RABBITMQ_URL: ${RABBITMQ_URL}
      RUN_MIGRATIONS: "false"
    depends_on:
      chat: {condition: service_healthy}

  chat-consumer:
    image: tara/chat:dev
    profiles: ["core"]
    command: ["python", "manage.py", "consume_events"]
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/6
      RABBITMQ_URL: ${RABBITMQ_URL}
      RUN_MIGRATIONS: "false"
    depends_on:
      chat: {condition: service_healthy}

  # ---- Realtime gateway (Phase 4) — ASGI/WebSocket, no DB -------------------
  realtime:
    build:
      context: ../..
      dockerfile: services/realtime/Dockerfile
    image: tara/realtime:dev
    profiles: ["core"]
    # Daphne drops oversized WebSocket frames/messages before buffering them
    # (the consumer itself closes above 16 KiB); Traefik cannot limit WS frames.
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000",
              "--websocket-max-message-size", "65536", "--websocket-max-frame-size", "65536",
              "config.asgi:application"]
    env_file:
      - ../../.env
    environment:
      REDIS_URL: redis://redis:6379/7
      RABBITMQ_URL: ${RABBITMQ_URL}
      TARA_JWKS_URL: http://identity:8000/.well-known/jwks.json
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true
      - "traefik.http.routers.realtime.rule=PathPrefix(`/ws`)"
      - traefik.http.routers.realtime.entrypoints=web
      - traefik.http.services.realtime.loadbalancer.server.port=8000

  realtime-bridge:
    image: tara/realtime:dev
    profiles: ["core"]
    command: ["python", "manage.py", "consume_events"]
    env_file:
      - ../../.env
    environment:
      REDIS_URL: redis://redis:6379/7
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      realtime: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  # ---- LiveKit SFU for calls (roadmap 3.7) — third-party, not a Tara service --
  # Signalling goes through the edge at /rtc (LIVEKIT_URL=ws://localhost:8080).
  # Media uses TCP 7881 and UDP 50000 on loopback; NODE_IP is what LiveKit
  # advertises to browsers. Chat turns calls on only when LIVEKIT_API_KEY and
  # LIVEKIT_API_SECRET are set in .env (the dev defaults below just keep this
  # container bootable when they are not).
  livekit:
    image: livekit/livekit-server:v1.13.10
    profiles: ["core"]
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-dev-only-livekit-secret-change-me-0123456789}"
      LIVEKIT_WEBHOOK_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      NODE_IP: 127.0.0.1
    volumes:
      - ../livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7881:7881"         # RTC over TCP (fallback)
      - "127.0.0.1:50000:50000/udp"   # RTC media (single-port UDP mux)
    labels:
      - traefik.enable=true
      - "traefik.http.routers.livekit.rule=PathPrefix(`/rtc`)"
      - traefik.http.routers.livekit.entrypoints=web
      - traefik.http.services.livekit.loadbalancer.server.port=7880

  # ---- Marketplace service (Phase 5) ---------------------------------------
  marketplace:
    build:
      context: ../..
      dockerfile: services/marketplace/Dockerfile
    image: tara/marketplace:dev
    profiles: ["core"]
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/8
      RABBITMQ_URL: ${RABBITMQ_URL}
      TARA_JWKS_URL: http://identity:8000/.well-known/jwks.json
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:8007:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true
      - "traefik.http.routers.marketplace.rule=PathPrefix(`/api/v1/marketplace`)"
      - traefik.http.routers.marketplace.entrypoints=web
      - traefik.http.services.marketplace.loadbalancer.server.port=8000

  marketplace-relay:
    image: tara/marketplace:dev
    profiles: ["core"]
    command: ["celery", "-A", "config", "worker", "-B", "-l", "info", "--concurrency", "2"]
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/8
      RABBITMQ_URL: ${RABBITMQ_URL}
      RUN_MIGRATIONS: "false"
    depends_on:
      marketplace: {condition: service_healthy}

  marketplace-consumer:
    image: tara/marketplace:dev
    profiles: ["core"]
    command: ["python", "manage.py", "consume_events"]
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/8
      RABBITMQ_URL: ${RABBITMQ_URL}
      RUN_MIGRATIONS: "false"
    depends_on:
      marketplace: {condition: service_healthy}

  # ---- Notification service (Phase 6) --------------------------------------
  notification:
    build: {context: ../.., dockerfile: services/notification/Dockerfile}
    image: tara/notification:dev
    profiles: ["core"]
    env_file: [../../.env]
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/9
      RABBITMQ_URL: ${RABBITMQ_URL}
      TARA_JWKS_URL: http://identity:8000/.well-known/jwks.json
      RUN_MIGRATIONS: "true"
    ports: ["127.0.0.1:8008:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true
      - "traefik.http.routers.notification.rule=PathPrefix(`/api/v1/notifications`) || PathPrefix(`/api/v1/devices`)"
      - traefik.http.routers.notification.entrypoints=web
      - traefik.http.services.notification.loadbalancer.server.port=8000

  notification-relay:
    image: tara/notification:dev
    profiles: ["core"]
    command: ["celery", "-A", "config", "worker", "-B", "-l", "info", "--concurrency", "2"]
    env_file: [../../.env]
    environment: {POSTGRES_HOST: postgres, REDIS_URL: "redis://redis:6379/9", RABBITMQ_URL: "${RABBITMQ_URL}", RUN_MIGRATIONS: "false"}
    depends_on: {notification: {condition: service_healthy}}

  notification-consumer:
    image: tara/notification:dev
    profiles: ["core"]
    command: ["python", "manage.py", "consume_events"]
    env_file: [../../.env]
    environment: {POSTGRES_HOST: postgres, REDIS_URL: "redis://redis:6379/9", RABBITMQ_URL: "${RABBITMQ_URL}", RUN_MIGRATIONS: "false"}
    depends_on: {notification: {condition: service_healthy}}

  # ---- Search service (Phase 6) --------------------------------------------
  search:
    build: {context: ../.., dockerfile: services/search/Dockerfile}
    image: tara/search:dev
    profiles: ["core"]
    env_file: [../../.env]
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/10
      RABBITMQ_URL: ${RABBITMQ_URL}
      TARA_JWKS_URL: http://identity:8000/.well-known/jwks.json
      RUN_MIGRATIONS: "true"
    ports: ["127.0.0.1:8009:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true
      - "traefik.http.routers.search.rule=PathPrefix(`/api/v1/search`)"
      - traefik.http.routers.search.entrypoints=web
      - traefik.http.services.search.loadbalancer.server.port=8000

  search-indexer:
    image: tara/search:dev
    profiles: ["core"]
    command: ["python", "manage.py", "consume_events"]
    env_file: [../../.env]
    environment: {POSTGRES_HOST: postgres, REDIS_URL: "redis://redis:6379/10", RABBITMQ_URL: "${RABBITMQ_URL}", RUN_MIGRATIONS: "false"}
    depends_on: {search: {condition: service_healthy}}

  # ---- Moderation service (Phase 6) ----------------------------------------
  moderation:
    build: {context: ../.., dockerfile: services/moderation/Dockerfile}
    image: tara/moderation:dev
    profiles: ["core"]
    env_file: [../../.env]
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/11
      RABBITMQ_URL: ${RABBITMQ_URL}
      TARA_JWKS_URL: http://identity:8000/.well-known/jwks.json
      RUN_MIGRATIONS: "true"
    ports: ["127.0.0.1:8011:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true
      - "traefik.http.routers.moderation.rule=PathPrefix(`/api/v1/moderation`)"
      - traefik.http.routers.moderation.entrypoints=web
      - traefik.http.services.moderation.loadbalancer.server.port=8000

  moderation-relay:
    image: tara/moderation:dev
    profiles: ["core"]
    command: ["celery", "-A", "config", "worker", "-B", "-l", "info", "--concurrency", "2"]
    env_file: [../../.env]
    environment: {POSTGRES_HOST: postgres, REDIS_URL: "redis://redis:6379/11", RABBITMQ_URL: "${RABBITMQ_URL}", RUN_MIGRATIONS: "false"}
    depends_on: {moderation: {condition: service_healthy}}

  moderation-consumer:
    image: tara/moderation:dev
    profiles: ["core"]
    command: ["python", "manage.py", "consume_events"]
    env_file: [../../.env]
    environment: {POSTGRES_HOST: postgres, REDIS_URL: "redis://redis:6379/11", RABBITMQ_URL: "${RABBITMQ_URL}", RUN_MIGRATIONS: "false"}
    depends_on: {moderation: {condition: service_healthy}}

  # ---- Admin service (Phase 6) ---------------------------------------------
  admin:
    build: {context: ../.., dockerfile: services/admin/Dockerfile}
    image: tara/admin:dev
    profiles: ["core"]
    env_file: [../../.env]
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/12
      RABBITMQ_URL: ${RABBITMQ_URL}
      TARA_JWKS_URL: http://identity:8000/.well-known/jwks.json
      RUN_MIGRATIONS: "true"
    ports: ["127.0.0.1:8012:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true
      - "traefik.http.routers.admin.rule=PathPrefix(`/api/v1/admin`)"
      - traefik.http.routers.admin.entrypoints=web
      - traefik.http.services.admin.loadbalancer.server.port=8000

  # Beat: outbox relay, health poll (30 s) and platform statistics (5 min).
  admin-relay:
    image: tara/admin:dev
    profiles: ["core"]
    command: ["celery", "-A", "config", "worker", "-B", "-l", "info", "--concurrency", "2"]
    env_file: [../../.env]
    environment: {POSTGRES_HOST: postgres, REDIS_URL: "redis://redis:6379/12", RABBITMQ_URL: "${RABBITMQ_URL}", RUN_MIGRATIONS: "false"}
    depends_on: {admin: {condition: service_healthy}}

  # Unified audit log: consumes role, capability, moderation and ad decisions.
  admin-consumer:
    image: tara/admin:dev
    profiles: ["core"]
    command: ["python", "manage.py", "consume_events"]
    env_file: [../../.env]
    environment: {POSTGRES_HOST: postgres, REDIS_URL: "redis://redis:6379/12", RABBITMQ_URL: "${RABBITMQ_URL}", RUN_MIGRATIONS: "false"}
    depends_on: {admin: {condition: service_healthy}}

  # ---- OpenSearch (optional; enable with --profile search + SEARCH_USE_OPENSEARCH=true)
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    profiles: ["search"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearchdata:/usr/share/opensearch/data

  # ---- Advertisement service (Phase 7) -------------------------------------
  ads:
    build: {context: ../.., dockerfile: services/ads/Dockerfile}
    image: tara/ads:dev
    profiles: ["core"]
    env_file: [../../.env]
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/13
      RABBITMQ_URL: ${RABBITMQ_URL}
      TARA_JWKS_URL: http://identity:8000/.well-known/jwks.json
      RUN_MIGRATIONS: "true"
    ports: ["127.0.0.1:8013:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true
      - "traefik.http.routers.ads.rule=PathPrefix(`/api/v1/ads`)"
      - traefik.http.routers.ads.entrypoints=web
      - traefik.http.services.ads.loadbalancer.server.port=8000

  ads-relay:
    image: tara/ads:dev
    profiles: ["core"]
    command: ["celery", "-A", "config", "worker", "-B", "-l", "info", "--concurrency", "2"]
    env_file: [../../.env]
    environment: {POSTGRES_HOST: postgres, REDIS_URL: "redis://redis:6379/13", RABBITMQ_URL: "${RABBITMQ_URL}", RUN_MIGRATIONS: "false"}
    depends_on: {ads: {condition: service_healthy}}

  # ---- Observability (profile: observability) -------------------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    profiles: ["observability"]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ../observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  miniodata:
  identity-keys:
  prometheusdata:
  grafanadata:
  opensearchdata:
