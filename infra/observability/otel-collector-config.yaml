# OpenTelemetry Collector (dev). Receives OTLP traces from services (when
# OTEL_ENABLED=true) and logs them. Swap the exporter for Tempo/Jaeger in prod.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
