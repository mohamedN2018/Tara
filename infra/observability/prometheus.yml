# Prometheus scrape config (dev). Services expose /metrics via django-prometheus.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: identity
    metrics_path: /metrics
    static_configs:
      - targets: ["identity:8000"]
        labels:
          service: identity

  # Future services register here as they come online, e.g.:
  # - job_name: profile
  #   static_configs: [{ targets: ["profile:8000"], labels: { service: profile } }]
