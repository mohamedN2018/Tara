name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.3
      - name: Ruff lint
        run: ruff check libs services scripts
      - name: Ruff format check
        run: ruff format --check libs services scripts

  # Every service, in its own image: real migrations, none missing, tests green.
  service-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity
          - profile
          - graph
          - media
          - post
          - feed
          - chat
          - realtime
          - marketplace
          - notification
          - search
          - moderation
          - admin
          - ads
          - bff
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres + Redis
        run: |
          cp .env.example .env
          docker compose -f infra/compose/docker-compose.yml --env-file .env             --profile core up -d --wait postgres redis
      - name: Build the service image
        run: |
          docker compose -f infra/compose/docker-compose.yml --env-file .env             --profile core build ${{ matrix.service }}
      - name: Migrations check + tests
        run: scripts/test-service.sh ${{ matrix.service }}

  # Building from the checkout is what catches files missing from git.
  docker-build:
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: identity, context: ., file: services/identity/Dockerfile}
          - {name: profile, context: ., file: services/profile/Dockerfile}
          - {name: graph, context: ., file: services/graph/Dockerfile}
          - {name: media, context: ., file: services/media/Dockerfile}
          - {name: post, context: ., file: services/post/Dockerfile}
          - {name: feed, context: ., file: services/feed/Dockerfile}
          - {name: chat, context: ., file: services/chat/Dockerfile}
          - {name: realtime, context: ., file: services/realtime/Dockerfile}
          - {name: marketplace, context: ., file: services/marketplace/Dockerfile}
          - {name: notification, context: ., file: services/notification/Dockerfile}
          - {name: search, context: ., file: services/search/Dockerfile}
          - {name: moderation, context: ., file: services/moderation/Dockerfile}
          - {name: admin, context: ., file: services/admin/Dockerfile}
          - {name: ads, context: ., file: services/ads/Dockerfile}
          - {name: bff, context: services/bff, file: services/bff/Dockerfile}
          - {name: web, context: frontend/web, file: frontend/web/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: tara/${{ matrix.name }}:ci

  # Lint, unit tests, type-check + production build of the Vue web client.
  # (Playwright needs the full stack; it joins CI in roadmap step 10.)
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install
        working-directory: frontend/web
        run: npm ci
      - name: Lint
        working-directory: frontend/web
        run: npm run lint
      - name: Unit tests (vitest)
        working-directory: frontend/web
        run: npm test
      - name: Type-check + build
        working-directory: frontend/web
        run: npm run build   # vue-tsc --noEmit && vite build

  # Validate deployment artifacts (compose, K8s manifests, alert rules).
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Validate docker-compose config
        run: |
          cp .env.example .env
          docker compose -f infra/compose/docker-compose.yml --env-file .env config -q
          docker network create dokploy-network
          # The Dokploy stack requires production-only secrets (RABBITMQ_PASS,
          # REDIS_PASSWORD, ...) that .env.example lacks. Validate it against a
          # throwaway env from the real generator, so the generator and the
          # compose file are also checked for drift. The file is discarded.
          ./scripts/gen-dokploy-env.sh --force --output "$RUNNER_TEMP/dokploy.env" example.com >/dev/null
          docker compose -f docker-compose.dokploy.yml --env-file "$RUNNER_TEMP/dokploy.env" config -q
          rm -f "$RUNNER_TEMP/dokploy.env"
      - name: Validate Kustomize overlays + cluster
        run: |
          for d in infra/k8s/overlays/*/ infra/k8s/cluster/; do
            kubectl kustomize "$d" >/dev/null && echo "kustomize OK: $d"
          done
      - name: Validate Prometheus rules + config
        run: |
          docker run --rm -v "$PWD/infra/observability:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
