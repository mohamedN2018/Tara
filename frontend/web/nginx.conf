# Single-origin edge: serve the SPA and reverse-proxy the API + WebSocket to the
# internal services. Backend hostnames are resolved at REQUEST time via Docker's
# embedded DNS (127.0.0.11) so a backend container can restart/move without
# requiring an nginx reload — self-healing routing.

# TLS ends at Traefik: keep the scheme it reports.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

# Rate limits, keyed on the real client address set below.
# An empty key is not limited: media transfers are large and already signed.
map $uri $api_limit_key {
  ~^/tara-media/ "";
  default        $binary_remote_addr;
}
limit_req_zone $api_limit_key zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
limit_req_status 429;

server {
  listen 80;
  server_name _;

  # Trust X-Forwarded-For only from the Docker networks (Traefik).
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Forwarded-For;

  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 1m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self)" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  # accounts.google.com/gsi/ is Google sign-in (script, button iframe, styles). The
  # SPA loads it only when identity reports GOOGLE_CLIENT_ID as set.
  # Sockets only to this host ('self' covers wss: in CSP3; the explicit entry is
  # for older Safari), so injected script cannot ship tokens to another host.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; connect-src 'self' wss://$host https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_read_timeout 60s;
  limit_req zone=api burst=60 nodelay;

  # Liveness for the container HEALTHCHECK.
  location = /healthz.txt { default_type text/plain; return 200 "ok\n"; }

  # ---- WebSocket (realtime gateway) ----------------------------------------
  location /ws/ {
    access_log off;  # the access token is in the query string
    set $realtime realtime;
    proxy_pass http://$realtime:8000$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # ---- Object storage: presigned URLs only, the bucket is private -----------
  # The signature covers Host, so the public host is passed through unchanged.
  location /tara-media/ {
    set $minio minio;
    proxy_pass http://$minio:9000$request_uri;
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 200m;
  }

  # ---- API services (path-prefix routing mirrors the gateway) --------------
  location /.well-known      { set $u identity;     proxy_pass http://$u:8000$request_uri; }
  location /api/v1/auth      { limit_req zone=auth burst=20 nodelay; set $u identity; proxy_pass http://$u:8000$request_uri; }
  location /api/v1/me        { set $u identity;     proxy_pass http://$u:8000$request_uri; }
  location /api/v1/users     { set $u profile;      proxy_pass http://$u:8000$request_uri; }
  location /api/v1/profile   { set $u profile;      proxy_pass http://$u:8000$request_uri; }
  location /api/v1/pages     { set $u profile;      proxy_pass http://$u:8000$request_uri; }
  location /api/v1/friends   { set $u graph;        proxy_pass http://$u:8000$request_uri; }
  location /api/v1/follows   { set $u graph;        proxy_pass http://$u:8000$request_uri; }
  location /api/v1/blocks    { set $u graph;        proxy_pass http://$u:8000$request_uri; }
  location /api/v1/social    { set $u graph;        proxy_pass http://$u:8000$request_uri; }
  location /api/v1/media     { set $u media;        proxy_pass http://$u:8000$request_uri; }
  location /api/v1/posts     { set $u post;         proxy_pass http://$u:8000$request_uri; }
  location /api/v1/comments  { set $u post;         proxy_pass http://$u:8000$request_uri; }
  location /api/v1/saved     { set $u post;         proxy_pass http://$u:8000$request_uri; }
  location /api/v1/feed      { set $u feed;         proxy_pass http://$u:8000$request_uri; }
  location /api/v1/conversations { set $u chat;     proxy_pass http://$u:8000$request_uri; }
  location /api/v1/messages  { set $u chat;         proxy_pass http://$u:8000$request_uri; }
  location /api/v1/marketplace { set $u marketplace; proxy_pass http://$u:8000$request_uri; }
  location /api/v1/notifications { set $u notification; proxy_pass http://$u:8000$request_uri; }
  location /api/v1/devices   { set $u notification; proxy_pass http://$u:8000$request_uri; }
  location /api/v1/search    { set $u search;       proxy_pass http://$u:8000$request_uri; }
  location /api/v1/moderation { set $u moderation;  proxy_pass http://$u:8000$request_uri; }
  location /api/v1/admin     { set $u admin;        proxy_pass http://$u:8000$request_uri; }
  location /api/v1/ads       { set $u ads;          proxy_pass http://$u:8000$request_uri; }

  # ---- SPA (everything else) -----------------------------------------------
  root /usr/share/nginx/html;

  # Hashed bundles never change; index.html must always be fresh after a deploy.
  # Uses `expires`: an add_header here would drop the security headers above.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    expires -1;
    try_files $uri =404;
  }
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
