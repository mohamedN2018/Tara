  <<: *common-env
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/9
  NOTIFICATION_ALLOWED_HOSTS: ${NOTIFICATION_ALLOWED_HOSTS:-}
  NOTIFICATION_DEBUG: ${NOTIFICATION_DEBUG:-}
  NOTIFICATION_SECRET_KEY: ${NOTIFICATION_SECRET_KEY:?}
  NOTIF_DB_NAME: ${NOTIF_DB_NAME:-}
  NOTIF_DB_PASSWORD: ${NOTIF_DB_PASSWORD:?}
  NOTIF_DB_USER: ${NOTIF_DB_USER:-}

x-search-env: &search-env
  <<: *common-env
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/10
  SEARCH_ALLOWED_HOSTS: ${SEARCH_ALLOWED_HOSTS:-}
  SEARCH_DB_NAME: ${SEARCH_DB_NAME:-}
