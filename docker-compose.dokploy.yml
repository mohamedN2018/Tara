  <<: *common-env
  # The web service migrates (entrypoint: only when it runs gunicorn).
  RUN_MIGRATIONS: "true"
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/12
  ADMIN_ALLOWED_HOSTS: ${ADMIN_ALLOWED_HOSTS:-${DOMAIN:?},admin,localhost,127.0.0.1}
  ADMIN_CORS_ORIGINS: ${ADMIN_CORS_ORIGINS:-https://${DOMAIN:?}}
  # Administrative notices: system.notice for notification (plan 08 T7).
  ADMIN_EMIT_SYSTEM_NOTICES: ${ADMIN_EMIT_SYSTEM_NOTICES:-true}
  ADMIN_DB_NAME: ${ADMIN_DB_NAME:-admin_db}
  ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?}
  ADMIN_DB_USER: ${ADMIN_DB_USER:-adminsvc}
  ADMIN_DEBUG: ${ADMIN_DEBUG:-false}
  ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:?}
  # Identity and admin only: signs admin's calls to identity's role API (1.0d).
  ADMIN_IDENTITY_SECRET: ${ADMIN_IDENTITY_SECRET:?}
  # Health poll and statistics (8.11), audit export (8.1), user console (8.6).
  # No BFF in this stack: an empty URL drops it from the health targets.
  ADMIN_BFF_READY_URL: ${ADMIN_BFF_READY_URL:-}
  ADMIN_HEALTH_POLL_SECONDS: ${ADMIN_HEALTH_POLL_SECONDS:-30}
  ADMIN_HEALTH_SNAPSHOTS_KEPT: ${ADMIN_HEALTH_SNAPSHOTS_KEPT:-500}
  ADMIN_STATS_POLL_SECONDS: ${ADMIN_STATS_POLL_SECONDS:-300}
  ADMIN_STATS_TIMEOUT: ${ADMIN_STATS_TIMEOUT:-5}
  ADMIN_AUDIT_EXPORT_MAX_ROWS: ${ADMIN_AUDIT_EXPORT_MAX_ROWS:-10000}
  ADMIN_AUDIT_EXPORT_RATE: ${ADMIN_AUDIT_EXPORT_RATE:-10/min}
  ADMIN_USERS_CALL_TIMEOUT: ${ADMIN_USERS_CALL_TIMEOUT:-3}
  ADMIN_USER_REVEAL_RATE: ${ADMIN_USER_REVEAL_RATE:-30/hour}

x-ads-env: &ads-env
  <<: *common-env
  # The web service migrates (entrypoint: only when it runs gunicorn).
  RUN_MIGRATIONS: "true"
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/13
  ADS_ALLOWED_HOSTS: ${ADS_ALLOWED_HOSTS:-${DOMAIN:?},ads,localhost,127.0.0.1}
  ADS_CORS_ORIGINS: ${ADS_CORS_ORIGINS:-https://${DOMAIN:?}}
  ADS_AUTO_APPROVE: ${ADS_AUTO_APPROVE:-false}
  ADS_DB_NAME: ${ADS_DB_NAME:-ads_db}
  ADS_DB_PASSWORD: ${ADS_DB_PASSWORD:?}
  ADS_DB_USER: ${ADS_DB_USER:-ads}
  ADS_DEBUG: ${ADS_DEBUG:-false}
  ADS_SECRET_KEY: ${ADS_SECRET_KEY:?}
  ADS_SERVE_TOKEN_SECRET: ${ADS_SERVE_TOKEN_SECRET:?}
  ADS_SERVING_ENABLED: ${ADS_SERVING_ENABLED:-false}

x-realtime-env: &realtime-env
  <<: *common-env
  # The web service migrates (entrypoint: only when it runs gunicorn).
  RUN_MIGRATIONS: "true"
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/7
  REALTIME_ALLOWED_HOSTS: ${REALTIME_ALLOWED_HOSTS:-${DOMAIN:?},realtime,localhost,127.0.0.1}
  REALTIME_DEBUG: ${REALTIME_DEBUG:-false}
  REALTIME_SECRET_KEY: ${REALTIME_SECRET_KEY:?}
  PRESENCE_BLOCK_MEMORY_TTL: ${PRESENCE_BLOCK_MEMORY_TTL:-3600}

services:
  # ======== backing services ================================================
  postgres:
    <<: *backing
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-tara}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      POSTGRES_DB: postgres
      # Read once by infra/postgres/init on an empty volume. Passed explicitly,
      # not via env_file, so the roles always get these passwords and never
      # the init script's dev fallbacks.
      IDENTITY_DB_NAME: ${IDENTITY_DB_NAME:-identity_db}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:-identity}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?}
      PROFILE_DB_NAME: ${PROFILE_DB_NAME:-profile_db}
      PROFILE_DB_USER: ${PROFILE_DB_USER:-profile}
      PROFILE_DB_PASSWORD: ${PROFILE_DB_PASSWORD:?}
      GRAPH_DB_NAME: ${GRAPH_DB_NAME:-graph_db}
      GRAPH_DB_USER: ${GRAPH_DB_USER:-graph}
      GRAPH_DB_PASSWORD: ${GRAPH_DB_PASSWORD:?}
      MEDIA_DB_NAME: ${MEDIA_DB_NAME:-media_db}
      MEDIA_DB_USER: ${MEDIA_DB_USER:-media}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:?}
      POST_DB_NAME: ${POST_DB_NAME:-post_db}
      POST_DB_USER: ${POST_DB_USER:-post}
      POST_DB_PASSWORD: ${POST_DB_PASSWORD:?}
      FEED_DB_NAME: ${FEED_DB_NAME:-feed_db}
      FEED_DB_USER: ${FEED_DB_USER:-feed}
      FEED_DB_PASSWORD: ${FEED_DB_PASSWORD:?}
      CHAT_DB_NAME: ${CHAT_DB_NAME:-chat_db}
      CHAT_DB_USER: ${CHAT_DB_USER:-chat}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:?}
      MARKET_DB_NAME: ${MARKET_DB_NAME:-market_db}
      MARKET_DB_USER: ${MARKET_DB_USER:-market}
      MARKET_DB_PASSWORD: ${MARKET_DB_PASSWORD:?}
      NOTIF_DB_NAME: ${NOTIF_DB_NAME:-notif_db}
      NOTIF_DB_USER: ${NOTIF_DB_USER:-notif}
      NOTIF_DB_PASSWORD: ${NOTIF_DB_PASSWORD:?}
      SEARCH_DB_NAME: ${SEARCH_DB_NAME:-search_db}
      SEARCH_DB_USER: ${SEARCH_DB_USER:-search}
      SEARCH_DB_PASSWORD: ${SEARCH_DB_PASSWORD:?}
      MODERATION_DB_NAME: ${MODERATION_DB_NAME:-moderation_db}
      MODERATION_DB_USER: ${MODERATION_DB_USER:-moderation}
      MODERATION_DB_PASSWORD: ${MODERATION_DB_PASSWORD:?}
      ADMIN_DB_NAME: ${ADMIN_DB_NAME:-admin_db}
      ADMIN_DB_USER: ${ADMIN_DB_USER:-adminsvc}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?}
      ADS_DB_NAME: ${ADS_DB_NAME:-ads_db}
      ADS_DB_USER: ${ADS_DB_USER:-ads}
      ADS_DB_PASSWORD: ${ADS_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-tara}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    <<: *backing
    image: redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    volumes: [redisdata:/data]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Feed ranking sessions (1.7). Rebuildable, so nothing is persisted; noeviction
  # makes a full redis-hot refuse writes (feed then serves latest order).
  redis-hot:
    <<: *backing
    image: redis:7.4.11-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD:?}",
              "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    <<: *backing
    image: rabbitmq:3.13.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tara}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?}
    volumes: [rabbitmqdata:/var/lib/rabbitmq]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 12

  minio:
    <<: *backing
    # Unique name for the edge: dokploy-network may hold another project\'s "minio".
    networks: {tara: {aliases: [tara-minio]}}
    # Official minio/minio images are no longer published; pinned by digest.
    image: cgr.dev/chainguard/minio@sha256:090010a3f73f6aa2dff606c61cd0de3640b22748abe19f4e48cce6dc9de7a53f
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tara}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes: [miniodata:/data]
    mem_limit: 512m
    healthcheck:
      # The image has no shell or curl; media retries S3 and creates the bucket.
      test: ["CMD", "minio", "--version"]
      interval: 15s
      timeout: 5s
      retries: 12

  # ======== web (HTTP) services =============================================
  identity:
    <<: *app
    # Unique name for the edge: dokploy-network may hold another project\'s "identity".
    networks: {tara: {aliases: [tara-identity]}}
    build: {context: ., dockerfile: services/identity/Dockerfile}
    image: tara/identity
    pull_policy: build
    environment: *identity-env
    volumes: [identity-keys:/app/.keys]
    mem_limit: 384m
    healthcheck: *healthcheck

  profile:
    <<: *app
    # Unique name for the edge: dokploy-network may hold another project\'s "profile".
    networks: {tara: {aliases: [tara-profile]}}
    build: {context: ., dockerfile: services/profile/Dockerfile}
    image: tara/profile
    pull_policy: build
    environment: *profile-env
    mem_limit: 384m
    healthcheck: *healthcheck

  graph:
    <<: *app
    # Unique name for the edge: dokploy-network may hold another project\'s "graph".
    networks: {tara: {aliases: [tara-graph]}}
    build: {context: ., dockerfile: services/graph/Dockerfile}
    image: tara/graph
    pull_policy: build
    environment: *graph-env
    mem_limit: 384m
    healthcheck: *healthcheck

  media:
    <<: *app
    # Unique name for the edge: dokploy-network may hold another project\'s "media".
    networks: {tara: {aliases: [tara-media]}}
    build: {context: ., dockerfile: services/media/Dockerfile}
    image: tara/media
    pull_policy: build
    environment: *media-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_healthy}
    mem_limit: 384m
    healthcheck: *healthcheck

  post:
    <<: *app
    # Unique name for the edge: dokploy-network may hold another project\'s "post".
    networks: {tara: {aliases: [tara-post]}}
    build: {context: ., dockerfile: services/post/Dockerfile}
    image: tara/post
    pull_policy: build
    environment: *post-env
    mem_limit: 384m
    healthcheck: *healthcheck

  feed:
    <<: *app
    # Unique name for the edge: dokploy-network may hold another project\'s "feed".
    networks: {tara: {aliases: [tara-feed]}}
    build: {context: ., dockerfile: services/feed/Dockerfile}
    image: tara/feed
    pull_policy: build
    environment: *feed-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      redis-hot: {condition: service_started}
      rabbitmq: {condition: service_healthy}
    mem_limit: 384m
    healthcheck: *healthcheck

  chat:
    <<: *app
    # Unique name for the edge: dokploy-network may hold another project\'s "chat".
    networks: {tara: {aliases: [tara-chat]}}
    build: {context: ., dockerfile: services/chat/Dockerfile}
    image: tara/chat
    pull_policy: build
    environment: *chat-env
    mem_limit: 384m
    healthcheck: *healthcheck

  marketplace:
    <<: *app
    # Unique name for the edge: dokploy-network may hold another project\'s "marketplace".
    networks: {tara: {aliases: [tara-marketplace]}}
    build: {context: ., dockerfile: services/marketplace/Dockerfile}
    image: tara/marketplace
    pull_policy: build
    environment: *marketplace-env
    mem_limit: 384m
    healthcheck: *healthcheck

  notification:
    <<: *app
    # Unique name for the edge: dokploy-network may hold another project\'s "notification".
    networks: {tara: {aliases: [tara-notification]}}
    build: {context: ., dockerfile: services/notification/Dockerfile}
    image: tara/notification
    pull_policy: build
    environment: *notification-env
    mem_limit: 384m
    healthcheck: *healthcheck

  search:
    <<: *app
    # Unique name for the edge: dokploy-network may hold another project\'s "search".
    networks: {tara: {aliases: [tara-search]}}
    build: {context: ., dockerfile: services/search/Dockerfile}
    image: tara/search
    pull_policy: build
    environment: *search-env
    mem_limit: 384m
    healthcheck: *healthcheck

  moderation:
    <<: *app
    # Unique name for the edge: dokploy-network may hold another project\'s "moderation".
    networks: {tara: {aliases: [tara-moderation]}}
    build: {context: ., dockerfile: services/moderation/Dockerfile}
    image: tara/moderation
    pull_policy: build
    environment: *moderation-env
    mem_limit: 384m
    healthcheck: *healthcheck

  admin:
    <<: *app
    # Unique name for the edge: dokploy-network may hold another project\'s "admin".
    networks: {tara: {aliases: [tara-admin]}}
    build: {context: ., dockerfile: services/admin/Dockerfile}
    image: tara/admin
    pull_policy: build
    environment: *admin-env
    mem_limit: 384m
    healthcheck: *healthcheck

  ads:
    <<: *app
    # Unique name for the edge: dokploy-network may hold another project\'s "ads".
    networks: {tara: {aliases: [tara-ads]}}
    build: {context: ., dockerfile: services/ads/Dockerfile}
    image: tara/ads
    pull_policy: build
    environment: *ads-env
    mem_limit: 384m
    healthcheck: *healthcheck

  realtime:
    <<: *app
    # Unique name for the edge: dokploy-network may hold another project\'s "realtime".
    networks: {tara: {aliases: [tara-realtime]}}
    build: {context: ., dockerfile: services/realtime/Dockerfile}
    image: tara/realtime
    pull_policy: build
    # Daphne drops oversized WebSocket frames/messages before buffering them
    # (the consumer itself closes above 16 KiB); nginx cannot limit WS frames.
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000",
              "--websocket-max-message-size", "65536", "--websocket-max-frame-size", "65536",
              "config.asgi:application"]
    environment: *realtime-env
    mem_limit: 256m
    healthcheck: *healthcheck

  # ======== calls: LiveKit SFU (roadmap 3.7), third-party, not a Tara service ==
  # Starts only with COMPOSE_PROFILES=calls (gen-dokploy-env.sh sets it with the
  # keys), so a deployment without keys never runs an SFU. Signalling is proxied
  # by the web edge at /rtc; media goes straight to the host on the ports below,
  # which the host firewall must open (docs/deploy/DOKPLOY.md, "Calls (LiveKit)").
  livekit:
    image: livekit/livekit-server:v1.13.10
    profiles: ["calls"]
    restart: unless-stopped
    logging: *logging
    networks: {tara: {aliases: [tara-livekit]}}
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      # `:-`, not `:?`: compose interpolates services of inactive profiles too,
      # and a deployment without calls must still come up.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
      LIVEKIT_WEBHOOK_API_KEY: ${LIVEKIT_API_KEY:-}
      # The public IP browsers reach. Empty: LiveKit finds it over STUN.
      NODE_IP: ${LIVEKIT_NODE_IP:-}
      LIVEKIT_RTC_USE_EXTERNAL_IP: "true"
      # TURN/UDP on 3478 for strict NATs (TURN over TLS on 443 is deferred).
      LIVEKIT_TURN_ENABLED: ${LIVEKIT_TURN_ENABLED:-true}
      LIVEKIT_TURN_DOMAIN: ${LIVEKIT_TURN_DOMAIN:-${DOMAIN:?}}
      LIVEKIT_TURN_UDP_PORT: "3478"
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881"           # RTC over TCP (fallback)
      - "50000:50000/udp"     # RTC media (single-port UDP mux)
      - "3478:3478/udp"       # TURN/UDP
    mem_limit: 512m

  # ======== async workers (outbox relay: celery worker + embedded beat) =====
  identity-worker:
    <<: *app
    image: tara/identity
    pull_policy: never   # built by the service of the same image
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-l", "info", "--concurrency", "2"]
    environment: *identity-env
    volumes: [identity-keys:/app/.keys]
    depends_on: {identity: {condition: service_healthy}}
    mem_limit: 256m

  profile-worker:
    <<: *app
    image: tara/profile
    pull_policy: never   # built by the service of the same image
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-l", "info", "--concurrency", "2"]
    environment: *profile-env
    depends_on: {profile: {condition: service_healthy}}
    mem_limit: 256m

  graph-worker:
    <<: *app
    image: tara/graph
    pull_policy: never   # built by the service of the same image
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-l", "info", "--concurrency", "2"]
    environment: *graph-env
    depends_on: {graph: {condition: service_healthy}}
    mem_limit: 256m

  media-worker:
    <<: *app
    image: tara/media
    pull_policy: never   # built by the service of the same image
    # Only media's own queue: video transcoding belongs to media-transcoder.
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-Q", "media.tasks", "-l", "info", "--concurrency", "2"]
    environment: *media-env
    depends_on: {media: {condition: service_healthy}}
    mem_limit: 256m

  # One-shot: the transcoder's MinIO user, limited to videos/ (roadmap §5.1).
  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:39768db4c3fa811bc8f2e2a3e0add8ea391648b1c980de179985e1c353dc1805
    entrypoint: ["/bin/sh", "/init/init-transcoder-user.sh"]
    restart: "no"
    logging: *logging
    networks: [tara]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tara}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      S3_BUCKET: ${S3_BUCKET:-tara-media}
      MEDIA_TRANSCODER_S3_ACCESS_KEY: ${MEDIA_TRANSCODER_S3_ACCESS_KEY:-tara-transcoder}
      MEDIA_TRANSCODER_S3_SECRET_KEY: ${MEDIA_TRANSCODER_S3_SECRET_KEY:?}
    volumes:
      - ./infra/minio:/init:ro
    depends_on: {minio: {condition: service_healthy}}
    mem_limit: 64m

  # Video transcoder (5.2): ffmpeg (in the media image) on queue media.transcode,
  # one job at a time, 2 CPUs and 1.5 GB at most, non-root, minimal environment.
  media-transcoder:
    <<: *app
    image: tara/media
    pull_policy: never   # built by the service of the same image
    command: ["celery", "-A", "config", "worker", "-Q", "media.transcode", "--concurrency", "1", "--prefetch-multiplier", "1", "-O", "fair", "--max-tasks-per-child", "50", "-l", "info"]
    environment: *media-transcoder-env
    depends_on:
      media: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    mem_limit: 1536m
    cpus: 2

  post-worker:
    <<: *app
    image: tara/post
    pull_policy: never   # built by the service of the same image
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-l", "info", "--concurrency", "2"]
    environment: *post-env
    depends_on: {post: {condition: service_healthy}}
    mem_limit: 256m

  feed-worker:
    <<: *app
    image: tara/feed
    pull_policy: never   # built by the service of the same image
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-l", "info", "--concurrency", "2"]
    environment: *feed-env
    depends_on: {feed: {condition: service_healthy}}
    mem_limit: 256m

  chat-worker:
    <<: *app
    image: tara/chat
    pull_policy: never   # built by the service of the same image
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-l", "info", "--concurrency", "2"]
    environment: *chat-env
    depends_on: {chat: {condition: service_healthy}}
    mem_limit: 256m

  marketplace-worker:
    <<: *app
    image: tara/marketplace
    pull_policy: never   # built by the service of the same image
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-l", "info", "--concurrency", "2"]
    environment: *marketplace-env
    depends_on: {marketplace: {condition: service_healthy}}
    mem_limit: 256m

  notification-worker:
    <<: *app
    image: tara/notification
    pull_policy: never   # built by the service of the same image
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-l", "info", "--concurrency", "2"]
    environment: *notification-env
    depends_on: {notification: {condition: service_healthy}}
    mem_limit: 256m

  moderation-worker:
    <<: *app
    image: tara/moderation
    pull_policy: never   # built by the service of the same image
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-l", "info", "--concurrency", "2"]
    environment: *moderation-env
    depends_on: {moderation: {condition: service_healthy}}
    mem_limit: 256m

  # Outbox relay, service-health poll (30 s) and platform statistics (5 min).
  admin-worker:
    <<: *app
    image: tara/admin
    pull_policy: never   # built by the service of the same image
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-l", "info", "--concurrency", "2"]
    environment: *admin-env
    depends_on: {admin: {condition: service_healthy}}
    mem_limit: 256m

  ads-worker:
    <<: *app
    image: tara/ads
    pull_policy: never   # built by the service of the same image
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-l", "info", "--concurrency", "2"]
    environment: *ads-env
    depends_on: {ads: {condition: service_healthy}}
    mem_limit: 256m

  # ======== event consumers (consume_events) ================================
  profile-consumer:
    <<: *app
    image: tara/profile
    pull_policy: never   # built by the service of the same image
    command: ["python", "manage.py", "consume_events"]
    environment: *profile-env
    depends_on: {profile: {condition: service_healthy}}
    mem_limit: 192m

  graph-consumer:
    <<: *app
    image: tara/graph
    pull_policy: never   # built by the service of the same image
    command: ["python", "manage.py", "consume_events"]
    environment: *graph-env
    depends_on: {graph: {condition: service_healthy}}
    mem_limit: 192m

  post-consumer:
    <<: *app
    image: tara/post
    pull_policy: never   # built by the service of the same image
    command: ["python", "manage.py", "consume_events"]
    environment: *post-env
    depends_on: {post: {condition: service_healthy}}
    mem_limit: 192m

  feed-consumer:
    <<: *app
    image: tara/feed
    pull_policy: never   # built by the service of the same image
    command: ["python", "manage.py", "consume_events"]
    environment: *feed-env
    depends_on: {feed: {condition: service_healthy}}
    mem_limit: 192m

  chat-consumer:
    <<: *app
    image: tara/chat
    pull_policy: never   # built by the service of the same image
    command: ["python", "manage.py", "consume_events"]
    environment: *chat-env
    depends_on: {chat: {condition: service_healthy}}
    mem_limit: 192m

  marketplace-consumer:
    <<: *app
    image: tara/marketplace
    pull_policy: never   # built by the service of the same image
    command: ["python", "manage.py", "consume_events"]
    environment: *marketplace-env
    depends_on: {marketplace: {condition: service_healthy}}
    mem_limit: 192m

  notification-consumer:
    <<: *app
    image: tara/notification
    pull_policy: never   # built by the service of the same image
    command: ["python", "manage.py", "consume_events"]
    environment: *notification-env
    depends_on: {notification: {condition: service_healthy}}
    mem_limit: 192m

  search-consumer:
    <<: *app
    image: tara/search
    pull_policy: never   # built by the service of the same image
    command: ["python", "manage.py", "consume_events"]
    environment: *search-env
    depends_on: {search: {condition: service_healthy}}
    mem_limit: 192m

  moderation-consumer:
    <<: *app
    image: tara/moderation
    pull_policy: never   # built by the service of the same image
    command: ["python", "manage.py", "consume_events"]
    environment: *moderation-env
    depends_on: {moderation: {condition: service_healthy}}
    mem_limit: 192m

  # Unified audit log (8.1): role, capability, moderation and ad decisions.
  admin-consumer:
    <<: *app
    image: tara/admin
    pull_policy: never   # built by the service of the same image
    command: ["python", "manage.py", "consume_events"]
    environment: *admin-env
    depends_on: {admin: {condition: service_healthy}}
    mem_limit: 192m

  # Realtime event→socket bridge (no DB).
  realtime-bridge:
    <<: *app
    image: tara/realtime
    pull_policy: never   # built by the service of the same image
    command: ["python", "manage.py", "consume_events"]
    environment: *realtime-env
    depends_on: {realtime: {condition: service_healthy}}
    mem_limit: 192m

  # ======== single-origin edge (SPA + API/WS/media reverse proxy) ===========
  web:
    build:
      context: frontend/web
      args:
        VITE_API_BASE: /api/v1
        VITE_WS_URL: ""
    image: tara/web
    pull_policy: build
    restart: unless-stopped
    logging: *logging
    networks: [tara, dokploy-network]
    depends_on:
      - identity
      - realtime
    mem_limit: 128m
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - "traefik.http.routers.tara-web.rule=Host(`${DOMAIN:?}`)"
      - traefik.http.routers.tara-web.entrypoints=websecure
      - traefik.http.routers.tara-web.tls.certresolver=letsencrypt
      - traefik.http.services.tara-web.loadbalancer.server.port=80
      - "traefik.http.routers.tara-web-http.rule=Host(`${DOMAIN:?}`)"
      - traefik.http.routers.tara-web-http.entrypoints=web
      - traefik.http.routers.tara-web-http.middlewares=tara-https
      - traefik.http.middlewares.tara-https.redirectscheme.scheme=https

networks:
  tara:
    driver: bridge
    # Explicit subnet: a Dokploy host with many projects can run out of
    # Docker's default address pools ("all predefined address pools have been
    # fully subnetted"). Override TARA_NETWORK_SUBNET if it clashes on a host.
    ipam:
      config:
        - subnet: ${TARA_NETWORK_SUBNET:-10.213.13.0/24}
  dokploy-network:
    external: true

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  miniodata:
  identity-keys:
