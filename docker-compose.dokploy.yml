# =============================================================================
# Tara — production stack for Dokploy (single domain).
#
# On first boot Postgres creates every per-service database/role, identity
# generates its JWT keys, each service applies its committed migrations, and
# media creates the private bucket. `restart: unless-stopped` + healthchecks
# keep it running, and the nginx edge resolves backends at request time.
#
# Only the `web` container (nginx) is reachable from the internet, through
# Dokploy's Traefik on ${DOMAIN}. Media is served through it at /tara-media/ via
# presigned URLs; the bucket itself is private.
#
# Each service receives only the variables it needs. Generate them with
# scripts/gen-dokploy-env.sh (writes .env_prod); see docs/deploy/DOKPLOY.md.
#
# Same containers as infra/compose (--profile core), minus the dev-only ones
# (mailpit, traefik, bff). Names differ: each dev `<svc>-relay` and
# `identity-beat` is a `<svc>-worker` here (Celery worker with embedded beat),
# and dev `search-indexer` is `search-consumer`.
#
# Images: the tara/* images exist only on the server, never on a registry.
# Each service with a `build` section has `pull_policy: build`, and every
# worker/consumer that reuses its image has `pull_policy: never`, so
# `up -d --build` builds them first and never asks Docker Hub for tara/*.
# Third-party images are pinned to exact tags or digests.
# =============================================================================
name: tara

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

x-common-env: &common-env
  TARA_ENV: production
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-tara}:${RABBITMQ_PASS:?}@rabbitmq:5672//
  TARA_JWKS_URL: http://identity:8000/.well-known/jwks.json
  GRAPH_INTERNAL_URL: http://graph:8000
  ADS_INTERNAL_URL: http://ads:8000
  JWT_ISSUER: ${JWT_ISSUER:-tara-identity}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-tara}
  INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?}
  SEARCH_USE_OPENSEARCH: "false"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: json
  TZ: ${TZ:-UTC}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
  TARA_NUM_PROXIES: "1"
  TARA_EVENT_EXCHANGE: ${TARA_EVENT_EXCHANGE:-tara.events}
  # Per-user API limits in every service (production defaults; dev raises them).
  TARA_READ_RATE: ${TARA_READ_RATE:-600/min}
  TARA_WRITE_RATE: ${TARA_WRITE_RATE:-120/min}
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  # Service-to-service base URLs (internal network only, never routed by the edge).
  IDENTITY_INTERNAL_URL: http://identity:8000
  PROFILE_INTERNAL_URL: http://profile:8000
  MEDIA_INTERNAL_URL: http://media:8000
  POST_INTERNAL_URL: http://post:8000
  CHAT_INTERNAL_URL: http://chat:8000
  MARKETPLACE_INTERNAL_URL: http://marketplace:8000

x-backing: &backing
  restart: unless-stopped
  logging: *logging
  networks: [tara]

x-app: &app
  restart: unless-stopped
  logging: *logging
  networks: [tara]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}

x-healthcheck: &healthcheck
  test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz/"]
  interval: 15s
  timeout: 5s
  retries: 12
  start_period: 60s

x-identity-env: &identity-env
  <<: *common-env
  # The web service migrates (entrypoint: only when it runs gunicorn).
  RUN_MIGRATIONS: "true"
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  # Allowed hosts: the public domain, the service name (internal calls) and
  # localhost (container healthcheck). Same pattern for every service below.
  IDENTITY_ALLOWED_HOSTS: ${IDENTITY_ALLOWED_HOSTS:-${DOMAIN:?},identity,localhost,127.0.0.1}
  IDENTITY_CORS_ORIGINS: ${IDENTITY_CORS_ORIGINS:-https://${DOMAIN:?}}
  # RS256 signing pair as one-line PEMs with literal \n. Empty: identity
  # generates a pair once into the identity-keys volume (back it up).
  IDENTITY_JWT_PRIVATE_KEY: ${IDENTITY_JWT_PRIVATE_KEY:-}
  IDENTITY_JWT_PUBLIC_KEY: ${IDENTITY_JWT_PUBLIC_KEY:-}
  # Auth throttles (production defaults; .env.example raises them for e2e).
  AUTH_REGISTER_RATE: ${AUTH_REGISTER_RATE:-10/hour}
  AUTH_LOGIN_RATE: ${AUTH_LOGIN_RATE:-20/min}
  AUTH_PASSWORD_RATE: ${AUTH_PASSWORD_RATE:-5/hour}
  # 2FA, recovery codes, deactivate and delete, per account (3C).
  ACCOUNT_SECURITY_RATE: ${ACCOUNT_SECURITY_RATE:-30/hour}
  IDENTITY_SUSPENSION_EXPIRY_SECONDS: ${IDENTITY_SUSPENSION_EXPIRY_SECONDS:-60}
  # Registration consent (track 1D): the versions the sign-up form records.
  LEGAL_TERMS_VERSION: ${LEGAL_TERMS_VERSION:-2026-11-04-draft}
  LEGAL_PRIVACY_VERSION: ${LEGAL_PRIVACY_VERSION:-2026-11-04-draft}
  REGISTRATION_MIN_AGE: ${REGISTRATION_MIN_AGE:-13}
  # Sign-in by username asks profile for the handle (internal API).
  PROFILE_CALL_TIMEOUT: ${PROFILE_CALL_TIMEOUT:-2}
  IDENTITY_DB_NAME: ${IDENTITY_DB_NAME:-identity_db}
  IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?}
  IDENTITY_DB_USER: ${IDENTITY_DB_USER:-identity}
  IDENTITY_DEBUG: ${IDENTITY_DEBUG:-false}
  IDENTITY_JWT_KEY_ID: ${IDENTITY_JWT_KEY_ID:-prod-key-1}
  IDENTITY_SECRET_KEY: ${IDENTITY_SECRET_KEY:?}
  # Identity and admin only: identity's role API refuses INTERNAL_JWT_SECRET (1.0d).
  ADMIN_IDENTITY_SECRET: ${ADMIN_IDENTITY_SECRET:?}
  # Identity and chat only: chat's call to the capability-holders list.
  CHAT_IDENTITY_SECRET: ${CHAT_IDENTITY_SECRET:?}
  # Role and capability-matrix events for admin's audit log (8.1, deploy note).
  IDENTITY_EMIT_AUDIT_EVENTS: ${IDENTITY_EMIT_AUDIT_EVENTS:-true}
  # account.suspended/unsuspended, account.signed_out, account.verification.resent (8.4, 8.6).
  IDENTITY_EMIT_ACCOUNT_ACTION_EVENTS: ${IDENTITY_EMIT_ACCOUNT_ACTION_EVENTS:-true}
  REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
  REFRESH_REUSE_GRACE_SECONDS: ${REFRESH_REUSE_GRACE_SECONDS:-20}
  # Empty: no mail is sent (set EMAIL_VERIFICATION_REQUIRED=false then).
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-true}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
  # Empty: no-reply@DOMAIN. Your SMTP provider must allow sending from it.
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@${DOMAIN:?}}
  FRONTEND_BASE_URL: https://${DOMAIN:?}
  IDENTITY_JWT_KEY_DIR: /app/.keys
  # Optional sign-in and phone verification: each is off while empty.
  AUTH_LOGIN_TARGET_RATE: ${AUTH_LOGIN_TARGET_RATE:-10/min}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  # Two-factor sign-in (3C): TOTP secrets at rest; empty derives from IDENTITY_SECRET_KEY.
  IDENTITY_TOTP_ENCRYPTION_KEY: ${IDENTITY_TOTP_ENCRYPTION_KEY:-}
  IDENTITY_STAFF_REQUIRE_2FA: ${IDENTITY_STAFF_REQUIRE_2FA:-false}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}

