# =============================================================================
# Tara — production stack for Dokploy (single domain).
#
# On first boot Postgres creates every per-service database/role, identity
# generates its JWT keys, each service applies its committed migrations, and
# media creates the private bucket. `restart: unless-stopped` + healthchecks
# keep it running, and the nginx edge resolves backends at request time.
#
# Only the `web` container (nginx) is reachable from the internet, through
# Dokploy's Traefik on ${DOMAIN}. Media is served through it at /tara-media/ via
# presigned URLs; the bucket itself is private.
#
# Each service receives only the variables it needs. Generate them with
# scripts/gen-dokploy-env.sh; see docs/deploy/DOKPLOY.md.
# =============================================================================
name: tara

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

x-common-env: &common-env
  TARA_ENV: production
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-tara}:${RABBITMQ_PASS:?}@rabbitmq:5672//
  TARA_JWKS_URL: http://identity:8000/.well-known/jwks.json
  GRAPH_INTERNAL_URL: http://graph:8000
  ADS_INTERNAL_URL: http://ads:8000
  JWT_ISSUER: ${JWT_ISSUER:-tara-identity}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-tara}
  INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?}
  SEARCH_USE_OPENSEARCH: "false"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: json
  TZ: ${TZ:-UTC}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
  TARA_NUM_PROXIES: "1"

x-backing: &backing
  restart: unless-stopped
  logging: *logging
  networks: [tara]

x-app: &app
  restart: unless-stopped
  logging: *logging
  networks: [tara]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}

x-healthcheck: &healthcheck
  test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz/"]
  interval: 15s
  timeout: 5s
  retries: 12
  start_period: 60s

x-identity-env: &identity-env
  <<: *common-env
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-}
  IDENTITY_ALLOWED_HOSTS: ${IDENTITY_ALLOWED_HOSTS:-}
  IDENTITY_CORS_ORIGINS: ${IDENTITY_CORS_ORIGINS:-}
  IDENTITY_DB_NAME: ${IDENTITY_DB_NAME:-}
  IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?}
  IDENTITY_DB_USER: ${IDENTITY_DB_USER:-}
  IDENTITY_DEBUG: ${IDENTITY_DEBUG:-}
  IDENTITY_JWT_KEY_ID: ${IDENTITY_JWT_KEY_ID:-}
  IDENTITY_SECRET_KEY: ${IDENTITY_SECRET_KEY:?}
  REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-}
  EMAIL_HOST: ${EMAIL_HOST:?set your SMTP host}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?}
  FRONTEND_BASE_URL: https://${DOMAIN:?}
  IDENTITY_JWT_KEY_DIR: /app/.keys

x-profile-env: &profile-env
