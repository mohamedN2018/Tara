services:
  # ======== backing services ================================================
  postgres:
    <<: *backing
    image: postgres:16-alpine
    env_file: [.env]   # the init script reads every service's database settings
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-tara}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-tara}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    <<: *backing
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    volumes: [redisdata:/data]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    <<: *backing
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tara}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?}
    volumes: [rabbitmqdata:/var/lib/rabbitmq]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 12

  minio:
    <<: *backing
    # Official minio/minio images are no longer published; pinned by digest.
    image: cgr.dev/chainguard/minio@sha256:090010a3f73f6aa2dff606c61cd0de3640b22748abe19f4e48cce6dc9de7a53f
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tara}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes: [miniodata:/data]
    mem_limit: 512m
    healthcheck:
      # The image has no shell or curl; media retries S3 and creates the bucket.
      test: ["CMD", "minio", "--version"]
      interval: 15s
      timeout: 5s
      retries: 12

  # ======== web (HTTP) services =============================================
  identity:
    <<: *app
    build: {context: ., dockerfile: services/identity/Dockerfile}
    image: tara/identity
    environment: {<<: *identity-env, RUN_MIGRATIONS: "true"}
    volumes: [identity-keys:/app/.keys]
    mem_limit: 384m
    healthcheck: *healthcheck

  profile:
    <<: *app
    build: {context: ., dockerfile: services/profile/Dockerfile}
    image: tara/profile
    environment: {<<: *profile-env, RUN_MIGRATIONS: "true"}
    mem_limit: 384m
    healthcheck: *healthcheck

  graph:
    <<: *app
    build: {context: ., dockerfile: services/graph/Dockerfile}
    image: tara/graph
    environment: {<<: *graph-env, RUN_MIGRATIONS: "true"}
    mem_limit: 384m
    healthcheck: *healthcheck

  media:
    <<: *app
    build: {context: ., dockerfile: services/media/Dockerfile}
    image: tara/media
    environment: {<<: *media-env, RUN_MIGRATIONS: "true"}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_healthy}
    mem_limit: 384m
    healthcheck: *healthcheck

  post:
    <<: *app
    build: {context: ., dockerfile: services/post/Dockerfile}
    image: tara/post
    environment: {<<: *post-env, RUN_MIGRATIONS: "true"}
    mem_limit: 384m
    healthcheck: *healthcheck

  feed:
    <<: *app
    build: {context: ., dockerfile: services/feed/Dockerfile}
    image: tara/feed
    environment: {<<: *feed-env, RUN_MIGRATIONS: "true"}
    mem_limit: 384m
    healthcheck: *healthcheck

  chat:
    <<: *app
    build: {context: ., dockerfile: services/chat/Dockerfile}
    image: tara/chat
    environment: {<<: *chat-env, RUN_MIGRATIONS: "true"}
    mem_limit: 384m
    healthcheck: *healthcheck

  marketplace:
    <<: *app
    build: {context: ., dockerfile: services/marketplace/Dockerfile}
    image: tara/marketplace
    environment: {<<: *marketplace-env, RUN_MIGRATIONS: "true"}
    mem_limit: 384m
    healthcheck: *healthcheck

  notification:
    <<: *app
    build: {context: ., dockerfile: services/notification/Dockerfile}
    image: tara/notification
    environment: {<<: *notification-env, RUN_MIGRATIONS: "true"}
    mem_limit: 384m
    healthcheck: *healthcheck

  search:
    <<: *app
    build: {context: ., dockerfile: services/search/Dockerfile}
    image: tara/search
    environment: {<<: *search-env, RUN_MIGRATIONS: "true"}
    mem_limit: 384m
    healthcheck: *healthcheck

  moderation:
    <<: *app
    build: {context: ., dockerfile: services/moderation/Dockerfile}
    image: tara/moderation
    environment: {<<: *moderation-env, RUN_MIGRATIONS: "true"}
    mem_limit: 384m
    healthcheck: *healthcheck

  admin:
    <<: *app
    build: {context: ., dockerfile: services/admin/Dockerfile}
    image: tara/admin
    environment: {<<: *admin-env, RUN_MIGRATIONS: "true"}
    mem_limit: 384m
    healthcheck: *healthcheck

  ads:
    <<: *app
    build: {context: ., dockerfile: services/ads/Dockerfile}
    image: tara/ads
    environment: {<<: *ads-env, RUN_MIGRATIONS: "true"}
    mem_limit: 384m
    healthcheck: *healthcheck

  realtime:
    <<: *app
    build: {context: ., dockerfile: services/realtime/Dockerfile}
    image: tara/realtime
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"]
    environment: {<<: *realtime-env}
    mem_limit: 256m
    healthcheck: *healthcheck

  # ======== async workers (outbox relay: celery worker + embedded beat) =====
  identity-worker:
    <<: *app
    image: tara/identity
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-l", "info", "--concurrency", "2"]
    environment: {<<: *identity-env, RUN_MIGRATIONS: "false"}
    volumes: [identity-keys:/app/.keys]
    depends_on: {identity: {condition: service_healthy}}
    mem_limit: 256m

  profile-worker:
    <<: *app
    image: tara/profile
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-l", "info", "--concurrency", "2"]
    environment: {<<: *profile-env, RUN_MIGRATIONS: "false"}
    depends_on: {profile: {condition: service_healthy}}
    mem_limit: 256m

  graph-worker:
    <<: *app
    image: tara/graph
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-l", "info", "--concurrency", "2"]
    environment: {<<: *graph-env, RUN_MIGRATIONS: "false"}
    depends_on: {graph: {condition: service_healthy}}
    mem_limit: 256m

  media-worker:
    <<: *app
    image: tara/media
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-l", "info", "--concurrency", "2"]
    environment: {<<: *media-env, RUN_MIGRATIONS: "false"}
    depends_on: {media: {condition: service_healthy}}
    mem_limit: 256m

  post-worker:
    <<: *app
    image: tara/post
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-l", "info", "--concurrency", "2"]
    environment: {<<: *post-env, RUN_MIGRATIONS: "false"}
    depends_on: {post: {condition: service_healthy}}
    mem_limit: 256m

  feed-worker:
    <<: *app
    image: tara/feed
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-l", "info", "--concurrency", "2"]
    environment: {<<: *feed-env, RUN_MIGRATIONS: "false"}
    depends_on: {feed: {condition: service_healthy}}
    mem_limit: 256m

  chat-worker:
    <<: *app
    image: tara/chat
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-l", "info", "--concurrency", "2"]
    environment: {<<: *chat-env, RUN_MIGRATIONS: "false"}
    depends_on: {chat: {condition: service_healthy}}
    mem_limit: 256m

  marketplace-worker:
    <<: *app
    image: tara/marketplace
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-l", "info", "--concurrency", "2"]
    environment: {<<: *marketplace-env, RUN_MIGRATIONS: "false"}
    depends_on: {marketplace: {condition: service_healthy}}
    mem_limit: 256m

  notification-worker:
    <<: *app
    image: tara/notification
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-l", "info", "--concurrency", "2"]
    environment: {<<: *notification-env, RUN_MIGRATIONS: "false"}
    depends_on: {notification: {condition: service_healthy}}
    mem_limit: 256m

  moderation-worker:
    <<: *app
    image: tara/moderation
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-l", "info", "--concurrency", "2"]
    environment: {<<: *moderation-env, RUN_MIGRATIONS: "false"}
    depends_on: {moderation: {condition: service_healthy}}
    mem_limit: 256m

  ads-worker:
    <<: *app
    image: tara/ads
    command: ["celery", "-A", "config", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-l", "info", "--concurrency", "2"]
    environment: {<<: *ads-env, RUN_MIGRATIONS: "false"}
    depends_on: {ads: {condition: service_healthy}}
    mem_limit: 256m

  # ======== event consumers (consume_events) ================================
  profile-consumer:
    <<: *app
    image: tara/profile
    command: ["python", "manage.py", "consume_events"]
    environment: {<<: *profile-env, RUN_MIGRATIONS: "false"}
    depends_on: {profile: {condition: service_healthy}}
    mem_limit: 192m

  graph-consumer:
    <<: *app
    image: tara/graph
    command: ["python", "manage.py", "consume_events"]
    environment: {<<: *graph-env, RUN_MIGRATIONS: "false"}
    depends_on: {graph: {condition: service_healthy}}
    mem_limit: 192m

  post-consumer:
    <<: *app
    image: tara/post
    command: ["python", "manage.py", "consume_events"]
    environment: {<<: *post-env, RUN_MIGRATIONS: "false"}
    depends_on: {post: {condition: service_healthy}}
    mem_limit: 192m

  feed-consumer:
    <<: *app
    image: tara/feed
    command: ["python", "manage.py", "consume_events"]
    environment: {<<: *feed-env, RUN_MIGRATIONS: "false"}
    depends_on: {feed: {condition: service_healthy}}
    mem_limit: 192m

  chat-consumer:
    <<: *app
    image: tara/chat
    command: ["python", "manage.py", "consume_events"]
    environment: {<<: *chat-env, RUN_MIGRATIONS: "false"}
    depends_on: {chat: {condition: service_healthy}}
    mem_limit: 192m

  marketplace-consumer:
    <<: *app
    image: tara/marketplace
    command: ["python", "manage.py", "consume_events"]
    environment: {<<: *marketplace-env, RUN_MIGRATIONS: "false"}
    depends_on: {marketplace: {condition: service_healthy}}
    mem_limit: 192m

  notification-consumer:
    <<: *app
    image: tara/notification
    command: ["python", "manage.py", "consume_events"]
    environment: {<<: *notification-env, RUN_MIGRATIONS: "false"}
    depends_on: {notification: {condition: service_healthy}}
    mem_limit: 192m

  search-consumer:
    <<: *app
    image: tara/search
    command: ["python", "manage.py", "consume_events"]
    environment: {<<: *search-env, RUN_MIGRATIONS: "false"}
    depends_on: {search: {condition: service_healthy}}
    mem_limit: 192m

  moderation-consumer:
    <<: *app
    image: tara/moderation
    command: ["python", "manage.py", "consume_events"]
    environment: {<<: *moderation-env, RUN_MIGRATIONS: "false"}
    depends_on: {moderation: {condition: service_healthy}}
    mem_limit: 192m

  # Realtime event→socket bridge (no DB).
  realtime-bridge:
    <<: *app
    image: tara/realtime
    command: ["python", "manage.py", "consume_events"]
    environment: {<<: *realtime-env}
    depends_on: {realtime: {condition: service_healthy}}
    mem_limit: 192m

  # ======== single-origin edge (SPA + API/WS/media reverse proxy) ===========
  web:
    build:
      context: frontend/web
      args:
        VITE_API_BASE: /api/v1
        VITE_WS_URL: ""
    image: tara/web
    restart: unless-stopped
    logging: *logging
    networks: [tara, dokploy-network]
    depends_on:
      - identity
      - realtime
    mem_limit: 128m
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - "traefik.http.routers.tara-web.rule=Host(`${DOMAIN:?}`)"
      - traefik.http.routers.tara-web.entrypoints=websecure
      - traefik.http.routers.tara-web.tls.certresolver=letsencrypt
      - traefik.http.services.tara-web.loadbalancer.server.port=80
      - "traefik.http.routers.tara-web-http.rule=Host(`${DOMAIN:?}`)"
      - traefik.http.routers.tara-web-http.entrypoints=web
      - traefik.http.routers.tara-web-http.middlewares=tara-https
      - traefik.http.middlewares.tara-https.redirectscheme.scheme=https

networks:
  tara:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  miniodata:
  identity-keys:
