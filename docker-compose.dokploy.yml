x-media-env: &media-env
  <<: *common-env
  # The web service migrates (entrypoint: only when it runs gunicorn).
  RUN_MIGRATIONS: "true"
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/3
  MEDIA_ALLOWED_HOSTS: ${MEDIA_ALLOWED_HOSTS:-${DOMAIN:?},media,localhost,127.0.0.1}
  MEDIA_CORS_ORIGINS: ${MEDIA_CORS_ORIGINS:-https://${DOMAIN:?}}
  MEDIA_DB_NAME: ${MEDIA_DB_NAME:-media_db}
  MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:?}
  MEDIA_DB_USER: ${MEDIA_DB_USER:-media}
  MEDIA_DEBUG: ${MEDIA_DEBUG:-false}
  MEDIA_SECRET_KEY: ${MEDIA_SECRET_KEY:?}
  S3_BUCKET: ${S3_BUCKET:-tara-media}
  S3_REGION: ${S3_REGION:-us-east-1}
  TARA_STORAGE_BACKEND: s3
  # Bundled MinIO by default. For S3 or Cloudflare R2 set S3_ENDPOINT_URL,
  # S3_PUBLIC_ENDPOINT_URL, S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY.
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-https://${DOMAIN:?}}
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-tara}}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:?}}
  # Video pipeline (5.2 / 5.3): upload caps and quota, playback tokens.
  MEDIA_VIDEO_MAX_BYTES_POST: ${MEDIA_VIDEO_MAX_BYTES_POST:-209715200}
  MEDIA_VIDEO_MAX_SECONDS_POST: ${MEDIA_VIDEO_MAX_SECONDS_POST:-600}
  MEDIA_VIDEO_DAILY_UPLOADS: ${MEDIA_VIDEO_DAILY_UPLOADS:-20}
  MEDIA_VIDEO_DAILY_BYTES: ${MEDIA_VIDEO_DAILY_BYTES:-2147483648}
  MEDIA_PLAYBACK_SECRET: ${MEDIA_PLAYBACK_SECRET:-}
  MEDIA_PLAYBACK_TOKEN_TTL: ${MEDIA_PLAYBACK_TOKEN_TTL:-3600}
  MEDIA_HLS_URL_WINDOW_SECONDS: ${MEDIA_HLS_URL_WINDOW_SECONDS:-300}
  MEDIA_PLAYBACK_ACCESS_CACHE_SECONDS: ${MEDIA_PLAYBACK_ACCESS_CACHE_SECONDS:-30}
  # Declared by media and the transcoder alike: the queue arguments must match.
  MEDIA_TRANSCODE_CONSUMER_TIMEOUT_MS: ${MEDIA_TRANSCODE_CONSUMER_TIMEOUT_MS:-7200000}

# The video transcoder (5.2) runs untrusted files through ffmpeg, so it gets
# only this: its database, the broker, a storage user limited to videos/ and
# the video limits. Not common-env: no INTERNAL_JWT_SECRET, no JWKS, no Redis,
# no MinIO root, no MEDIA_SECRET_KEY (settings make random per-process ones).
x-media-transcoder-env: &media-transcoder-env
  TARA_ENV: production
  MEDIA_ROLE: transcoder
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  MEDIA_DB_NAME: ${MEDIA_DB_NAME:-media_db}
  MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:?}
  MEDIA_DB_USER: ${MEDIA_DB_USER:-media}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-tara}:${RABBITMQ_PASS:?}@rabbitmq:5672//
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: json
  TZ: ${TZ:-UTC}
  TARA_STORAGE_BACKEND: s3
  S3_BUCKET: ${S3_BUCKET:-tara-media}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  AWS_ACCESS_KEY_ID: ${MEDIA_TRANSCODER_S3_ACCESS_KEY:-tara-transcoder}
  AWS_SECRET_ACCESS_KEY: ${MEDIA_TRANSCODER_S3_SECRET_KEY:?set MEDIA_TRANSCODER_S3_SECRET_KEY (scripts/gen-dokploy-env.sh)}
  MEDIA_VIDEO_MAX_SECONDS_POST: ${MEDIA_VIDEO_MAX_SECONDS_POST:-600}
  MEDIA_VIDEO_MAX_HEIGHT: ${MEDIA_VIDEO_MAX_HEIGHT:-720}
  MEDIA_VIDEO_HDR_MODE: ${MEDIA_VIDEO_HDR_MODE:-tonemap}
  MEDIA_VIDEO_MP4_FALLBACK: ${MEDIA_VIDEO_MP4_FALLBACK:-false}
  MEDIA_KEEP_VIDEO_ORIGINALS: ${MEDIA_KEEP_VIDEO_ORIGINALS:-false}
  MEDIA_TRANSCODE_STEP_TIMEOUT: ${MEDIA_TRANSCODE_STEP_TIMEOUT:-1200}
  MEDIA_TRANSCODE_CONSUMER_TIMEOUT_MS: ${MEDIA_TRANSCODE_CONSUMER_TIMEOUT_MS:-7200000}
  MEDIA_VIDEO_MAX_FPS: ${MEDIA_VIDEO_MAX_FPS:-30}
  MEDIA_VIDEO_MAX_PIXELS: ${MEDIA_VIDEO_MAX_PIXELS:-8294400}
  MEDIA_FFMPEG_THREADS: ${MEDIA_FFMPEG_THREADS:-2}
  MEDIA_FFMPEG_MAX_MEMORY_MB: ${MEDIA_FFMPEG_MAX_MEMORY_MB:-1200}
  MEDIA_TRANSCODE_SCRATCH_DIR: ${MEDIA_TRANSCODE_SCRATCH_DIR:-/tmp/tara-transcode}

